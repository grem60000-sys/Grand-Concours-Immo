<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMO ARENA — La Ligue des Mascottes</title>
<style>
:root{
  --bg1:#060F1E; --bg2:#0B2440; --teal:#0F766E; --teal2:#14B8A6; --amber:#F59E0B;
  --green:#16A34A; --red:#DC2626; --ink:#F8FAFC; --muted:#94A3B8; --card:#0F2A40; --line:#1E4060;
  --t0:#F43F5E; --t1:#F59E0B; --t2:#14B8A6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at top,#173E6B 0%,var(--bg2) 38%,var(--bg1) 100%);min-height:100vh;overflow-x:hidden}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
button{font-family:inherit}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:18px 22px 40px;animation:appin .35s ease}
@keyframes appin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--amber)}
h1.big{font-size:clamp(30px,4vw,54px);margin:6px 0 4px;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,.4)}
h1.glow{background:linear-gradient(90deg,#FDE047,#F97316,#F43F5E,#A855F7,#22D3EE,#FDE047);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;font-size:clamp(46px,8vw,110px);letter-spacing:.04em;filter:drop-shadow(0 6px 30px rgba(249,115,22,.35))}
@keyframes shine{to{background-position:300% 0}}
.hero .tag{display:inline-block;margin:4px 0 8px;padding:6px 18px;border-radius:999px;background:rgba(245,158,11,.15);border:2px solid rgba(245,158,11,.5);color:#FDE68A;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.sub{color:var(--muted);font-size:17px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0A4F4A;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0A4F4A}
.btn:disabled{background:#475569;box-shadow:none;cursor:not-allowed}
.btn.amb{background:linear-gradient(180deg,#FBBF24,#F59E0B);color:#1F1300;box-shadow:0 4px 0 #A16207}
.btn.red{background:var(--red);box-shadow:0 4px 0 #7F1D1D}
.btn.grn{background:var(--green);box-shadow:0 4px 0 #14532D}
.btn.ghost{background:rgba(255,255,255,.03);border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.card{background:rgba(13,36,58,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.lift{transition:transform .2s}.lift:hover{transform:translateY(-6px)}
input,select{font-family:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#0A2236;color:var(--ink);width:100%}
label.l{display:block;font-weight:700;margin:12px 0 6px;color:#CBD5E1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.center{text-align:center}
.mt{margin-top:18px}
.hide{display:none!important}
.small{font-size:14px;color:var(--muted)}
.cwrap{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.cwrap.wide{grid-template-columns:1fr 290px}
/* mascottes */
.masc{overflow:visible;display:inline-block}
.masc .m-all{transform-origin:100px 205px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.015,.985)}}
.masc .m-eyes{transform-origin:100px 118px;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.masc .m-arm-l{transform-origin:44px 132px}.masc .m-arm-r{transform-origin:156px 132px}
.masc .m-tear{opacity:0}
.masc .m-aura{animation:aura 3s ease-in-out infinite;transform-origin:100px 128px}
@keyframes aura{50%{transform:scale(1.06);opacity:.7}}
.masc .m-stars{animation:twk 1.6s ease-in-out infinite}@keyframes twk{50%{opacity:.6}}
.st-happy .m-all{animation:jump .75s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-26px) scale(.95,1.06)}65%{transform:translateY(0) scale(1.08,.92)}}
.st-happy .m-arm-l{animation:wavel .75s ease-in-out infinite}.st-happy .m-arm-r{animation:waver .75s ease-in-out infinite}
@keyframes wavel{50%{transform:rotate(70deg)}}@keyframes waver{50%{transform:rotate(-70deg)}}
.st-sad .m-all{animation:sad 1.8s ease-in-out infinite}
@keyframes sad{0%,100%{transform:scale(1.04,.95) rotate(-3deg)}50%{transform:scale(1.06,.93) rotate(3deg)}}
.st-sad .m-tear{opacity:1;animation:tear 1.2s ease-in infinite}@keyframes tear{from{transform:translateY(0)}to{transform:translateY(26px);opacity:0}}
.st-sad .m-mouth{transform:rotate(180deg);transform-origin:100px 150px}
.st-attack .m-all{animation:lunge .6s ease-in-out}
@keyframes lunge{40%{transform:translateY(-20px) scale(1.15) rotate(-8deg)}}
.st-hit .m-all{animation:shk .5s linear}
.st-hit{filter:drop-shadow(0 0 16px #F43F5E) saturate(1.6)}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.st-ko .m-all{animation:none;transform:rotate(80deg) translate(40px,10px);transform-origin:100px 205px}
.st-ko{filter:grayscale(.9) brightness(.7);transition:filter .5s}
.parade{display:flex;justify-content:center;gap:22px;margin:22px 0 8px;flex-wrap:wrap}
.parade .pm{animation:popin .6s both cubic-bezier(.2,1.4,.4,1);text-align:center}
.parade.sm{margin:10px 0}
@keyframes popin{from{transform:scale(.2) translateY(40px);opacity:0}}
.pop{animation:popin .7s cubic-bezier(.2,1.4,.4,1)}
/* tableau des scores */
.scoreboard .team{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;margin:10px 0;font-weight:800;border:3px solid transparent}
.scoreboard .smasc{flex:0 0 52px}.scoreboard .smasc svg{width:52px;height:58px}
.scoreboard .tinfo{flex:1;min-width:0}
.scoreboard .tname{font-size:14px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.scoreboard .tgr{font-size:12px;color:#CBD5E1;font-weight:600}
.xp{height:6px;background:rgba(0,0,0,.35);border-radius:4px;margin-top:4px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#FDE047,#F97316)}
.scoreboard .pts{font-size:24px;text-align:right;flex:0 0 auto}.scoreboard .pts small{display:block;font-size:16px}
.tc0{background:linear-gradient(90deg,rgba(244,63,94,.35),rgba(244,63,94,.1));border-color:var(--t0)!important}
.tc1{background:linear-gradient(90deg,rgba(245,158,11,.35),rgba(245,158,11,.1));border-color:var(--t1)!important}
.tc2{background:linear-gradient(90deg,rgba(20,184,166,.35),rgba(20,184,166,.1));border-color:var(--t2)!important}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#475569;margin-right:7px}
.dot.on{background:#22C55E;box-shadow:0 0 10px #22C55E}
.code{font-size:110px;font-weight:900;letter-spacing:.15em;color:var(--amber);text-shadow:0 0 40px rgba(245,158,11,.5)}
.lobbyt{padding:14px}.lobbyt .lm{min-height:150px;display:flex;align-items:center;justify-content:center}
.egg{font-size:80px;animation:wob 1.2s ease-in-out infinite}@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
/* menu */
.famh{font-weight:900;font-size:18px;color:#FDE68A;margin:8px 0 10px;letter-spacing:.04em}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.games.newg{grid-template-columns:repeat(4,1fr)}
.gtile{background:linear-gradient(160deg,#13405F,#0B2A40);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;position:relative;min-height:150px;transition:transform .15s,border-color .15s,box-shadow .2s}
.gtile.new{background:linear-gradient(160deg,#3B1E6E,#122A4F 60%,#0B2A40);border-color:#6D28D9;box-shadow:0 0 0 0 rgba(168,85,247,.0)}
.gtile.new:hover{box-shadow:0 0 30px rgba(168,85,247,.45)}
.gtile:hover{transform:translateY(-5px) rotate(-.5deg);border-color:var(--amber)}
.gtile .ic{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.gtile h3{margin:6px 0 2px;font-size:20px}
.gtile .insp{color:var(--amber);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.gtile .meta{color:var(--muted);font-size:13px;margin-top:6px}
.gtile.done{opacity:.72}.gtile .ck{position:absolute;top:10px;right:10px;background:var(--green);font-weight:900;font-size:13px;padding:3px 9px;border-radius:999px}
.introic{font-size:90px;animation:popin .6s both cubic-bezier(.2,1.4,.4,1)}
.themes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px auto;max-width:950px}
.thc{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2px solid var(--c);background:rgba(0,0,0,.2);cursor:pointer;font-size:14px;font-weight:700}
.thc input{width:auto;accent-color:var(--c)}
/* questions */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:16px}
.qnum{font-weight:800;color:var(--amber);font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.qtext{font-size:clamp(24px,2.6vw,36px);font-weight:800;line-height:1.25;margin:12px 0 16px}
.qtext.sm{font-size:clamp(20px,2vw,28px)}
.timer{position:relative;width:110px;height:110px;flex:0 0 110px}
.timer .tv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900}
.timer.warn .tv{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}.opts.o3c{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;font-size:clamp(17px,1.6vw,23px);font-weight:700;color:#fff;border:0;text-align:left;cursor:pointer;min-height:74px;transition:transform .1s}
button.opt:hover{transform:scale(1.02)}
.opt .sh{flex:0 0 44px;height:44px;border-radius:10px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;font-size:22px}
.o0{background:#E11D48}.o1{background:#2563EB}.o2{background:#CA8A04}.o3{background:#16A34A}
.opt.dim{opacity:.28}
.opt.right{outline:5px solid #fff;box-shadow:0 0 30px rgba(255,255,255,.7);animation:rightp .8s ease 2}
@keyframes rightp{50%{transform:scale(1.04)}}
.opt.sel{outline:5px solid #fff}
.ansbar{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.ansbar .chip{flex:1 1 200px;padding:10px 14px;border-radius:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mask{font-family:"Courier New",monospace;font-weight:900;font-size:clamp(28px,4vw,56px);letter-spacing:.3em;text-align:center;margin:10px 0 18px;color:var(--amber);word-break:break-all}
.res td,.res th{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:18px}
.res th{color:var(--muted);font-size:13px;text-transform:uppercase}
table.res{width:100%;border-collapse:collapse}
.ok{color:#4ADE80;font-weight:800}.ko{color:#F87171;font-weight:800}
.answer-box{background:rgba(22,163,74,.18);border:2px solid var(--green);border-radius:14px;padding:12px 16px;font-size:20px;font-weight:800;margin:12px 0}
.triitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#0A2236;margin:8px 0;font-size:19px;font-weight:600}
.triitem .bt{display:flex;gap:8px}
.triitem .bt button{border:2px solid var(--line);background:#0F2A40;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:15px}
.triitem .bt button.on{background:var(--teal);border-color:var(--teal2)}
.pbar{height:26px;background:#0A2236;border-radius:13px;overflow:hidden;border:2px solid var(--line)}.pbar div{height:100%;transition:width .3s}
.buzz{width:min(360px,80vw);height:min(360px,80vw);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FF6B6B,#B91C1C 70%);color:#fff;font-size:56px;font-weight:900;box-shadow:0 14px 0 #7F1D1D,0 20px 40px rgba(0,0,0,.5);cursor:pointer}
.buzz:active{transform:translateY(10px);box-shadow:0 4px 0 #7F1D1D}
.buzz:disabled{background:#475569;box-shadow:0 8px 0 #1E293B;cursor:not-allowed;font-size:30px}
.flash{animation:flash .8s 3}@keyframes flash{50%{background:rgba(245,158,11,.35)}}
/* équipe */
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;border-radius:16px;margin-bottom:16px;font-weight:900;font-size:21px}
.thead small{font-weight:600;font-size:14px;color:#E2E8F0}.thead .thm{flex:0 0 44px}.thead>span:nth-child(2){flex:1}
.teambtn{width:100%;margin:6px 0;font-size:22px;box-shadow:none;border:3px solid;display:flex;align-items:center;gap:12px;justify-content:center}
.waiting{font-size:24px;text-align:center;color:var(--muted);padding:30px 10px}
.wm{display:flex;justify-content:center;margin-bottom:10px}
.verdict{font-size:36px;font-weight:900;text-align:center;padding:20px;border-radius:18px;margin:12px 0}
.verdict.ok{background:rgba(22,163,74,.25)}.verdict.ko{background:rgba(220,38,38,.25)}.verdict.neu{background:rgba(148,163,184,.15);color:#E2E8F0}
.rev{display:flex;gap:18px;align-items:center}.rvm{flex:0 0 150px}
/* créateur */
.creator{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
.cstage{position:relative;height:300px;display:flex;align-items:center;justify-content:center;margin:10px 0}
.cstage .spot1{position:absolute;bottom:10px;width:260px;height:60px;border-radius:50%;background:radial-gradient(rgba(253,224,71,.45),transparent 70%)}
.crow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.clab{flex:0 0 100px;font-weight:900;color:#FDE68A;padding-top:6px}
.cch{display:flex;flex-wrap:wrap;gap:7px}
.chipb{border:2px solid var(--line);background:#0A2236;color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:14px}
.chipb.on{background:var(--teal);border-color:var(--teal2);box-shadow:0 0 12px rgba(20,184,166,.6)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #0B1626;cursor:pointer}
.sw.on{outline:4px solid #fff;transform:scale(1.1)}
/* bannière */
.banner{position:fixed;left:50%;top:16%;transform:translate(-50%,-50%);z-index:1000;background:linear-gradient(135deg,#7C3AED,#F59E0B);padding:20px 34px;border-radius:24px;font-size:32px;font-weight:900;display:flex;align-items:center;gap:20px;box-shadow:0 20px 80px rgba(0,0,0,.6);animation:bann 2.6s ease forwards}
@keyframes bann{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.floattxt{position:fixed;z-index:1000;font-weight:900;font-size:26px;pointer-events:none;animation:flt 1.4s ease-out forwards;text-shadow:0 2px 8px #000}
@keyframes flt{to{transform:translateY(-60px);opacity:0}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:24px 0}
.pcol{display:flex;flex-direction:column;align-items:center}
.podium .p{width:230px;text-align:center;border-radius:16px 16px 0 0;padding:16px;font-weight:900;font-size:22px}
.confetti{position:fixed;top:-20px;z-index:999;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.status{position:fixed;bottom:10px;right:12px;z-index:5;font-size:12px;color:var(--muted);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
/* jeux : canvas */
.trackcv{width:100%;height:auto;border-radius:16px;display:block;border:2px solid var(--line)}
.runwrap{position:relative}.runwrap canvas{width:100%;height:auto;border-radius:16px;display:block;cursor:pointer;border:2px solid var(--line)}
.runq .rq{font-size:22px;font-weight:800;margin:4px 0 8px}.rqn{display:inline-block;background:var(--amber);color:#111;border-radius:8px;padding:2px 8px;margin-right:10px;font-size:15px}
.ro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.rop{border-radius:12px;padding:10px 12px;font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center;border:3px solid transparent;transition:transform .15s}
.rop b{font-size:24px;background:rgba(0,0,0,.25);border-radius:8px;padding:0 10px}
.rop.on{border-color:#fff;transform:translateY(-3px);box-shadow:0 0 18px rgba(255,255,255,.4)}
.l0{background:#2563EB}.l1{background:#D97706}.l2{background:#DB2777}
.lanebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.lb{border:0;border-radius:14px;color:#fff;font-size:30px;font-weight:900;padding:12px;cursor:pointer;opacity:.75}.lb.on{opacity:1;outline:4px solid #fff}
.towerwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.towerwrap canvas{width:100%;height:auto;border-radius:16px;border:2px solid var(--line);cursor:pointer}
/* scènes */
.scenewrap svg.scene{width:100%;height:auto;border-radius:14px;display:block;border:2px solid var(--line)}
.spot.clk{cursor:pointer}.spot.clk:hover rect:first-child{fill-opacity:.12}
.pulse{animation:pls 1s ease-in-out infinite}@keyframes pls{50%{stroke-opacity:.3}}
.expl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.expl.sm{grid-template-columns:1fr}
.ex{background:rgba(253,224,71,.08);border:1px solid rgba(253,224,71,.35);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;position:relative}
.ex b{color:#FDE68A}.ex span{color:#E2E8F0;font-size:15px}.ex em{position:absolute;top:8px;right:8px;display:flex;gap:4px}.ex em i{width:14px;height:14px;border-radius:50%;display:block}
/* immeuble */
.bldwrap{display:grid;grid-template-columns:1fr;gap:12px}.bldwrap.calc{grid-template-columns:1.2fr 1fr;align-items:center}
.bldsvg svg{width:100%;height:auto;border-radius:14px;border:2px solid var(--line);display:block}.bldsvg.sm svg{max-height:340px}
.bld .el{transition:opacity .5s}.bld .el.dim{opacity:.35}.bld .el.hl{filter:drop-shadow(0 0 10px #FDE047) drop-shadow(0 0 22px #FDE047);animation:hlp 1s ease-in-out infinite}
@keyframes hlp{50%{filter:drop-shadow(0 0 3px #FDE047) drop-shadow(0 0 10px #FDE047)}}
table.lots{width:100%;border-collapse:collapse;font-size:16px;background:rgba(0,0,0,.2);border-radius:12px;overflow:hidden}
.lots td,.lots th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}.lots th{color:var(--muted);font-size:12px;text-transform:uppercase}.lots tr.on{background:rgba(253,224,71,.18);font-weight:900}
/* coffre */
.clues{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}.clues.sm{grid-template-columns:1fr}
.clue{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;font-weight:600}
.clue b{flex:0 0 36px;height:36px;border-radius:50%;background:var(--amber);color:#111;display:flex;align-items:center;justify-content:center;font-size:20px}
.clue em{margin-left:auto;font-style:normal;font-size:30px;font-weight:900;color:#4ADE80}
.vaults{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vault{display:flex;flex-direction:column;align-items:center;gap:8px}
.vbox{position:relative;width:200px;height:200px;border-radius:22px;background:linear-gradient(145deg,#374151,#111827);border:6px solid var(--tc);perspective:700px;box-shadow:inset 0 0 30px #000}

const Net=(()=>{ let ch=null,bc=null,handler=null,mode='none';
  const waitLib=()=>new Promise(r=>{let n=0;const t=setInterval(()=>{if(window.supabase||++n>40){clearInterval(t);r(!!window.supabase);}},100);});
  async function open(code,onMsg){ handler=onMsg;
    if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY&&await waitLib()){ try{
      const cl=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY,{realtime:{params:{eventsPerSecond:40}}});
      ch=cl.channel('immoarena-'+code,{config:{broadcast:{self:false}}});
      ch.on('broadcast',{event:'m'},({payload})=>{if(handler)handler(payload);});
      await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('délai dépassé')),9000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(to);res();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){clearTimeout(to);rej(new Error(st));}});});
      mode='online';setNet(true,'En ligne (Supabase)');return mode;}catch(e){console.warn('Supabase indisponible',e);mode='error';} }
    try{bc=new BroadcastChannel('immoarena-'+code);bc.onmessage=e=>{if(handler)handler(e.data);};}catch(e){}
    if(mode!=='error')mode='local';
    setNet(mode==='local',mode==='local'?'Mode test (un seul ordinateur)':'Supabase injoignable');return mode;}
  function send(m){try{if(ch&&mode==='online')ch.send({type:'broadcast',event:'m',payload:m});else if(bc)bc.postMessage(m);}catch(e){}}
  return {open,send,get mode(){return mode;}};})();

(function bg(){
  const cv=document.createElement("canvas");cv.id="bgfx";document.body.prepend(cv);const x=cv.getContext("2d");
  let W,H,P=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener("resize",rs);rs();
  for(let i=0;i<46;i++)P.push({x:Math.random(),y:Math.random(),r:8+Math.random()*46,s:.02+Math.random()*.05,h:[172,38,200,330,265][i%5],a:.05+Math.random()*.1});
  function f(t){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.s/600;if(p.y<-.1)p.y=1.1;const px=(p.x+Math.sin(t/9000+p.r)*.02)*W,py=p.y*H;const g=x.createRadialGradient(px,py,0,px,py,p.r);g.addColorStop(0,`hsla(${p.h},90%,60%,${p.a})`);g.addColorStop(1,`hsla(${p.h},90%,60%,0)`);x.fillStyle=g;x.beginPath();x.arc(px,py,p.r,0,7);x.fill();}requestAnimationFrame(f);}
  requestAnimationFrame(f);
})();

let G=null, LOOP=null, HB=null, RAF=null, PRT=0;

async function newSession(){

  G={code,teams:[0,1,2].map(i=>({name:$("#tn"+i).value.trim()||"Équipe "+(i+1),score:0,m:null,lvl:0})),played:{},used:{},cur:null,v:0,phase:"lobby",qc:0,joined:[false,false,false],lastExtra:{},themes:Object.keys(THEMES)};

async function resumeSession(){
  G=JSON.parse(localStorage.getItem(SKEY));G.joined=[false,false,false];
  if(!G.themes)G.themes=Object.keys(THEMES);
  if(G.cur&&G.cur.phase!=="reveal"){G.cur=null;G.phase="menu";}
  await openCentral();
  if(G.phase==="lobby")lobby();else menu();
}
function teamsLite(){return G.teams.map(t=>({name:t.name,score:t.score,m:t.m,lvl:t.lvl||0}));}
function sendState(){
  if(!G)return;const c=G.cur;
  const st={v:G.v,phase:G.phase,teams:teamsLite()};
  if(c&&G.phase==="game"){
    Object.assign(st,{game:c.game,gtitle:gameDef(c.game).title,qid:c.qid,num:c.i+1,total:c.game==="plateau"?c.pl.total:c.list.length,qphase:c.phase,dur:c.dur,payload:c.payload,
      mask:c.mask||null,clues:c.clues||null,excluded:c.excluded||[],buzzed:c.buzzed??null,attempt:c.attempt||0,results:c.results||null,correct:c.correctLabel||null,
      got:[0,1,2].map(k=>!!(c.answers&&k in c.answers)),wgot:[0,1,2].map(k=>!!(c.wagers&&k in c.wagers)),wagers:c.wagerDone?c.wagers:null,wmax:c.wmax||null});
    if(c.game==="chrono"&&c.ca)st.rc=[0,1,2].map(k=>Object.keys(c.ca[k]).map(Number));
    if(c.game==="coffre")st.safe=c.safe;
    if(c.game==="plateau")st.pl=c.pl;
    if(c.game==="duel")st.hp=c.hp;
    if(c.game==="visite"&&c.phase==="reveal")st.tf=c.tf;
    if(SELF_PACED.includes(c.game)&&c.prog)st.prog=c.prog;
    if(c.startAt&&["question","buzz","wager"].includes(c.phase))st.remMs=c.startAt+c.dur*1000-now();
  }
  Object.assign(st,G.lastExtra||{});
  Net.send({t:"st",s:st});
}
function pushState(extra){if(extra!==undefined)G.lastExtra=extra||{};G.v++;saveG();sendState();}

function centralOnMsg(m){
  if(!G||!m)return;
  if(m.t==="hello"){sendState();return;}
  if(m.t==="join"){const k=m.team;if(!G.joined[k]){G.joined[k]=true;sndJoin();}markJoined();sendState();return;}
  if(m.t==="masc"&&m.m&&m.team>=0&&m.team<3){const k=m.team;const first=!G.teams[k].m;G.teams[k].m=m.m;G.joined[k]=true;sndJoin();saveG();
    if(G.phase==="lobby")lobby();else refreshBoard();if(first&&G.phase==="lobby")setTimeout(()=>{const el=document.getElementById("lm"+k);if(el)el.classList.add("pop");},30);pushState();return;}
  const c=G.cur;if(!c||m.qid!==c.qid)return;
  const inTime=extra=>now()<=c.startAt+c.dur*1000+extra;
  if(m.t==="ans"&&c.phase==="question"&&!(m.team in c.answers)&&inTime(800)){
    c.answers[m.team]={v:m.v,t:Math.max(0,now()-c.startAt)};updChips();sendState();
  }
  if(m.t==="wg"&&c.phase==="wager"&&!(m.team in c.wagers)&&inTime(800)){
    const mx=c.wmax[m.team];c.wagers[m.team]=Math.max(0,Math.min(mx,Math.round(+m.w||0)));updChips(true);sendState();
  }
  if(m.t==="ca"&&c.phase==="question"&&c.game==="chrono"&&inTime(800)){
    if(!(m.i in c.ca[m.team])){c.ca[m.team][m.i]=m.v;updChrono();}
    sendState();
  }
  if(m.t==="bz"&&c.phase==="buzz"&&m.attempt===c.attempt&&!c.excluded.includes(m.team)&&inTime(500)){
    clearInterval(LOOP);c.buzzed=m.team;c.phase="buzzed";sndBuzz();pushState();renderQ();
  }
  if(m.t==="pg"&&c.phase==="question"&&SELF_PACED.includes(c.game)&&c.prog){
    const old=c.prog[m.team]||{};c.prog[m.team]=Object.assign({},m.p);if(old.finAt!=null)c.prog[m.team].finAt=old.finAt;
    if(c.game==="course"&&m.p.fin&&!old.fin){c.prog[m.team].finAt=now()-c.startAt;sndFanfare();}
    if(c.game==="tour"&&(m.p.f||0)>(old.f||0))sndCoin();
    if(now()-PRT>350){PRT=now();Net.send({t:"pr",qid:c.qid,prog:c.prog});}
  }
  if(m.t==="sf"&&c.game==="coffre"&&c.phase==="question")coffreTry(m.team,String(m.code||""));
  if(m.t==="roll"&&c.game==="plateau"&&c.phase==="roll"&&m.team===c.pl.active)plateauRoll();
}

function draw(gid,n,th){
  const b=BANKOF(gid);const themes=th?[th]:G.themes;
  const key=b;const used=G.used[key]||[];
  let idx=BANK[b].map((_,i)=>i).filter(i=>themes.includes(BANK[b][i].th));
  if(!idx.length)idx=BANK[b].map((_,i)=>i);
  let fresh=shuffle(idx.filter(i=>!used.includes(i)));
  if(fresh.length<n){G.used[key]=(G.used[key]||[]).filter(i=>!idx.includes(i));fresh=fresh.concat(shuffle(idx.filter(i=>!fresh.includes(i))));}
  const pick=fresh.slice(0,n);G.used[key]=(G.used[key]||[]).concat(pick);return pick;
}
function startGame(gid){
  const n=+$("#nq").value, dur=+$("#dq").value;

  else if(["course","tour"].includes(gid))list=[0];
  else if(gid==="visite")list=shuffle(GD.visite.map((_,i)=>i)).slice(0,n);
  else if(gid==="coffre")list=Array.from({length:n},(_,i)=>i);
  else if(gid==="immeuble")list=Array.from({length:n},(_,i)=>i);

  if(gid==="plateau")G.cur.pl={pos:[0,0,0],owner:{},active:0,dice:null,total:n*3,turn:0,msg:null,hl:null};
  G.phase="game";nextQ();
}
function buildChronoItems(){
  const items=[],key=[];
  const vfs=draw("vf",15), qs=draw("qcm",15);
  vfs.forEach(i=>{const q=BANK.vf[i];items.push({t:q.t,o:["VRAI","FAUX"]});key.push(q.a?0:1);});
  qs.forEach(i=>{const q=BANK.qcm[i];const ord=shuffle([0,1,2,3]);items.push({t:q.t,o:ord.map(k=>q.o[k])});key.push(ord.indexOf(0));});
  const order=shuffle(items.map((_,i)=>i));
  return {items:order.map(i=>items[i]),key:order.map(i=>key[i])};
}
/* --- tirage équilibré de la position de la bonne réponse --- */
function balancedOrders(nq,no){const pos=[];while(pos.length<nq)pos.push(...shuffle(Array.from({length:no},(_,i)=>i)));return shuffle(pos.slice(0,nq));}
function buildImmeubleQs(n){
  const I=GD.immeuble;const ncl=Math.max(1,Math.round(n*.6)),nca=n-ncl;
  const byc=[0,1,2].map(c=>shuffle(I.els.filter(e=>e.c===c)));const els=[];let ci=0;
  while(els.length<ncl){const c=ci%3;ci++;if(byc[c].length)els.push(byc[c].pop());if(!byc.some(a=>a.length))break;}
  const qs=shuffle(els).map(e=>({k:"cls",e}));
  for(let i=0;i<nca;i++){const lot=pick(I.lots.filter(l=>l.a>0||i%2===0));const kind=i%3;
    if(kind===0){const p=pick(I.postes.g),amt=rnd(6,48)*1000;qs.push({k:"calc",t:`Le syndic répartit ${fmtE(amt)} € pour ${p} (charges générales). Quelle est la part du lot ${lot.n} (${lot.g}/1000) ?`,a:amt*lot.g/1000,lot:lot.n});}
    else if(kind===1){const l2=pick(I.lots.filter(l=>l.a>0));const p=pick(I.postes.a),amt=rnd(3,24)*500;qs.push({k:"calc",t:`${p[0].toUpperCase()+p.slice(1)} coûte ${fmtE(amt)} € (charges d'ascenseur). Part du lot ${l2.n} (${l2.a}/1000 d'ascenseur) ?`,a:amt*l2.a/1000,lot:l2.n});}
    else{const b=rnd(16,60)*1000;qs.push({k:"calc",t:`Le budget prévisionnel général est de ${fmtE(b)} €. Montant de la provision trimestrielle du lot ${lot.n} (${lot.g}/1000) ?`,a:b*lot.g/1000/4,lot:lot.n});}
  }
  // les calculs viennent après la moitié des classements pour varier le rythme
  const cls=qs.filter(q=>q.k==="cls"),cal=shuffle(qs.filter(q=>q.k==="calc"));const out=[];const h=Math.ceil(cls.length/2);
  out.push(...cls.slice(0,h));out.push(...cal.slice(0,Math.ceil(cal.length/2)));out.push(...cls.slice(h));out.push(...cal.slice(Math.ceil(cal.length/2)));
  const pos=balancedOrders(out.filter(q=>q.k==="cls").length,3);let pi=0;out.forEach(q=>{if(q.k==="cls")q.rp=pos[pi++];});
  return out;
}
function coffreBuild(){
  const st=shuffle(GD.coffre).slice(0,2);const gen=[];
  const makers=[
    ()=>{const d=rnd(2,9);return {q:`Honoraires de 5 % sur un prix de ${fmtE(d*20000)} € : chiffre des milliers du montant`,a:d};},
    ()=>{const d=rnd(1,9);return {q:`Un lot de ${d*10}/1000 sur une dépense de 10 000 € : chiffre des centaines de sa part`,a:d};},
    ()=>{const d=rnd(1,9);return {q:`Capitalisation : loyer net de ${fmtE(d*3000)} € par an, taux de 3 % : premier chiffre de la valeur`,a:d};},
    ()=>{const d=rnd(3,9);return {q:`Rendement brut d'un bien de 100 000 € loué ${fmtE(d*1000)} € par an (en %)`,a:d};},
    ()=>{const d=rnd(1,9);return {q:`Provision trimestrielle d'un lot de ${d*10}/1000, budget de 40 000 € : chiffre des centaines`,a:d};},
  ];
  const ms=shuffle(makers).slice(0,2);ms.forEach(f=>gen.push(f()));
  const clues=shuffle(st.concat(gen));
  return {clues,code:clues.map(c=>c.a).join("")};
}

/* position de la bonne réponse tirée dans un paquet équilibré (A, B, C, D autant de fois) */
function qcmOrder(c){if(!c.deck||!c.deck.length)c.deck=shuffle([0,1,2,3]);const p=c.deck.pop();const o=shuffle([1,2,3]);o.splice(p,0,0);return o;}
function maskOf(w,revIdx){return [...w].map((ch,i)=>/[A-Z0-9]/.test(ch)?(revIdx.includes(i)?ch:"_"):(ch===" "?" ":ch)).join("");}

function tick(){

  const tw=document.getElementById("tw");if(tw)tw.innerHTML=timerSVG(rem,c.dur);

  if(c.phase==="question"){
    const el=(now()-c.startAt)/1000;
    if(c.game==="mot"){const want=Math.min(c.letters.length-2,Math.floor(el/c.step));if(want>c.revealed){c.revealed=want;c.mask=maskOf(BANK.mot[c.list[c.i]].w,c.revOrder.slice(0,want));const m=document.getElementById("maskC");if(m)m.textContent=c.mask;pushState();}}
    if(c.game==="qsj"){const q=BANK.qsj[c.list[c.i]];const want=Math.min(q.c.length,1+Math.floor(el/c.step));if(want>c.clues.length){c.clues=q.c.slice(0,want);renderQ();pushState();}}
    if(c.game==="chrono"){const N=c.payload.items.length;if([0,1,2].every(k=>Object.keys(c.ca[k]).length>=N)||rem<=-0.9)closeQ();return;}
    if(c.game==="course"){if([0,1,2].every(k=>c.prog[k].fin)||rem<=-0.9)closeQ();return;}
    if(c.game==="tour"){if([0,1,2].every(k=>c.prog[k].done)||rem<=-0.9)closeQ();return;}

  }else if(c.phase==="buzz"){

  }
}
function updChips(w){const c=G.cur;for(let k=0;k<3;k++){const el=document.getElementById("as"+k);if(!el)continue;const ok=w?(c.wagers&&k in c.wagers):(k in c.answers);el.innerHTML=ok?`<span class="ok">✔ ${w?"Mise reçue":"Réponse reçue"}</span>`:'<span class="small">en attente…</span>';}}

function qcmRes(c,k,base=100,bonus=50){const a=c.answers[k];const ok=!!a&&a.v===c.right;const sp=a?Math.max(0,1-a.t/(c.dur*1000)):0;return {ok,pts:ok?Math.round(base+bonus*sp):0,label:a?"ABCD"[a.v]+". "+c.payload.o[a.v]:"Pas de réponse",t:a?a.t:1e9};}
function numRes(c,target,unit){
  const R={};const ans=[0,1,2].filter(k=>c.answers[k]&&c.answers[k].v!==""&&!isNaN(+String(c.answers[k].v).replace(",","."))).map(k=>({k,d:Math.abs(+String(c.answers[k].v).replace(",",".")-target)}));

    R[k]={ok:exact,part:!exact&&rank===0,pts,label:String(a.v).replace(".",",")+(unit?" "+unit:"")+(exact?" (exact !)":" (écart "+fmtN(e.d)+")")};}
  return R;

    if(c.game==="mot"){const ok=!!a&&[q.w].concat(q.alt||[]).some(x=>norm(x)===norm(a.v));const rev=a?Math.min(c.letters.length-2,Math.floor((a.t/1000)/c.step)):0;R[k]={ok,pts:ok?Math.max(50,200-25*rev):0,label:a?a.v:"Pas de réponse"};}

    if(c.game==="tri"){const v=a?a.v:[];let n=0;c.items.forEach((it,j)=>{if(v[j]===q.items[it][1])n++;});R[k]={ok:n===c.items.length,pts:n*25,label:n+" / "+c.items.length+" bien classés",part:n>0&&n<c.items.length};}
    if(c.game==="ordre"){const v=a?a.v:[];let n=0;c.items.forEach((orig,j)=>{if(v[j]===orig)n++;});const all=n===c.items.length;R[k]={ok:all,pts:n*30+(all?50:0),label:n+" / "+c.items.length+" bien placées",part:n>0&&!all};}
    if(c.game==="chrono"){let ok=0,ko=0;Object.entries(c.ca[k]).forEach(([i,v])=>{if(v===c.key[+i])ok++;else ko++;});R[k]={ok:ok>0&&ko===0,part:ok>0&&ko>0,pts:Math.max(0,ok*20-ko*10),label:ok+" bonne"+(ok>1?"s":"")+" · "+ko+" erreur"+(ko>1?"s":"")};}
    if(c.game==="visite"){const S=GD.visite[c.payload.sc];const v=a&&Array.isArray(a.v)?a.v:[];const bad=S.spots.filter(p=>p.bad).map(p=>p.id);const good=v.filter(x=>bad.includes(x)).length,wrong=v.length-good;
      R[k]={ok:good===bad.length&&wrong===0,part:good>0&&!(good===bad.length&&wrong===0),pts:Math.max(0,good*60-wrong*30),label:`${good} / ${bad.length} anomalies · ${wrong} fausse${wrong>1?"s":""} alerte${wrong>1?"s":""}`};}
    if(c.game==="immeuble"){if(c.iq.k==="cls")R[k]=qcmRes(c,k);}
  }
  if(c.game==="num")R=numRes(c,q.a,q.u);
  if(c.game==="immeuble"&&c.iq.k==="calc")R=numRes(c,c.iq.a,"€");
  if(c.game==="visite")c.tf=[0,1,2].map(k=>c.answers[k]&&Array.isArray(c.answers[k].v)?c.answers[k].v:[]);
  if(c.game==="course"){const P=c.prog;const order=[0,1,2].slice().sort((a,b)=>{const fa=P[a].finAt??(P[a].fin?1e8:null),fb=P[b].finAt??(P[b].fin?1e8:null);if(fa!=null&&fb!=null)return fa-fb;if(fa!=null)return -1;if(fb!=null)return 1;return (P[b].d||0)-(P[a].d||0);});
    const bonus=[200,120,60];for(let k=0;k<3;k++){const p=P[k];const rk=order.indexOf(k);const moved=(p.d||0)>0;const pts=(p.ok||0)*25+(moved?bonus[rk]:0);R[k]={ok:rk===0&&moved,part:rk>0&&moved,pts,label:`${["1re","2e","3e"][rk]} place · ${p.ok||0} bonne${(p.ok||0)>1?"s":""} porte${(p.ok||0)>1?"s":""} · ${p.fin?"arrivée en "+Math.round((p.finAt||c.dur*1000)/1000)+" s":Math.round(Math.min(1,(p.d||0)/(p.len||1))*100)+" % du parcours"}`};}}
  if(c.game==="tour"){const P=c.prog;const mx=Math.max(...[0,1,2].map(k=>P[k].f||0));for(let k=0;k<3;k++){const p=P[k];const top=mx>0&&(p.f||0)===mx;const pts=(p.f||0)*40+(p.p||0)*20+(top?100:0);R[k]={ok:top,part:!top&&(p.f||0)>0,pts,label:`${p.f||0} étage${(p.f||0)>1?"s":""} · ${p.p||0} pose${(p.p||0)>1?"s":""} parfaite${(p.p||0)>1?"s":""}${top?" · la plus haute !":""}`};}}
  if(c.game==="coffre"){const bonus=[300,200,120];for(let k=0;k<3;k++){const s=c.safe[k]||{};R[k]={ok:!!s.open&&s.rank===1,part:!!s.open&&s.rank>1,pts:s.open?bonus[s.rank-1]:0,label:s.open?`Ouvert en ${Math.round(s.t/1000)} s (${s.att} essai${s.att>1?"s":""})`:`Fermé · meilleur essai : ${s.best||0} chiffre${(s.best||0)>1?"s":""} bien placé${(s.best||0)>1?"s":""}`};}}
  if(c.game==="duel")duelResolve(c,R);
  for(let k=0;k<3;k++){G.teams[k].score+=R[k].pts;c.gained[k]+=R[k].pts;}
  if([0,1,2].some(k=>R[k].ok))sndOk();else sndKo();
  if(c.game==="tri")c.correctLabel=q.c.map((cat,ci)=>cat+" : "+q.items.filter(it=>it[1]===ci).map(it=>it[0]).join(", ")).join(" — ");

  c.results=R;c.phase="reveal";checkGrades();
  pushState();renderQ();
}
function buzzJudge(ok){
  const c=G.cur;const k=c.buzzed;
  if(ok){G.teams[k].score+=150;c.gained[k]+=150;sndOk();c.results={[k]:{ok:true,pts:150}};c.phase="reveal";checkGrades();pushState();renderQ();return;}
  G.teams[k].score-=50;c.gained[k]-=50;c.excluded.push(k);c.buzzed=null;
  if(c.excluded.length>=3){c.results={};c.phase="reveal";pushState();renderQ();return;}
  c.attempt++;launchQ();
}
function skipBuzz(){clearInterval(LOOP);const c=G.cur;c.results={};c.phase="reveal";pushState();renderQ();}

/* ---------------- DUEL ---------------- */
function duelResolve(c,R){
  const alive=[0,1,2].filter(k=>c.hp[k]>0);
  const att=alive.filter(k=>R[k].ok).sort((a,b)=>R[a].t-R[b].t);
  const vic=alive.filter(k=>!R[k].ok);const ev=[];
  if(att.length&&vic.length){att.forEach((a,i)=>{const dmg=i===0?25:15;ev.push({a,v:vic.slice(),dmg,crit:i===0});vic.forEach(v=>c.hp[v]=Math.max(0,c.hp[v]-dmg));});}
  else if(att.length>1&&!vic.length){const a=att[0],v=att[att.length-1];ev.push({a,v:[v],dmg:10});c.hp[v]=Math.max(0,c.hp[v]-10);}
  else if(!att.length&&alive.length){ev.push({storm:true,v:alive.slice(),dmg:10});alive.forEach(v=>c.hp[v]=Math.max(0,c.hp[v]-10));}
  c.events=ev;
}
async function animateDuel(){
  const c=G.cur;if(!c||!c.events||c.animDone===c.qid)return;c.animDone=c.qid;
  const ar=document.getElementById("arena");if(!ar)return;
  const pos=k=>{const el=document.getElementById("dm"+k);const r=el.getBoundingClientRect(),ra=ar.getBoundingClientRect();return [r.left-ra.left+r.width/2,r.top-ra.top+r.height/2];};
  const hpShow=JSON.parse(ar.dataset.hp||"[100,100,100]");
  for(const e of c.events){
    await sleep(500);
    if(e.storm){sndHit();ar.classList.add("storm");e.v.forEach(v=>{hit(v,e.dmg);});await sleep(900);ar.classList.remove("storm");continue;}
    const a=document.getElementById("dm"+e.a);if(!a)continue;a.querySelector("svg").setAttribute("class","masc st-attack");sndWhoosh();
    for(const v of e.v){const [x1,y1]=pos(e.a),[x2,y2]=pos(v);const p=document.createElement("div");p.className="proj"+(e.crit?" crit":"");p.textContent=pick(["🔑","🏠","📜","🖋️","📐"]);p.style.left=x1+"px";p.style.top=y1+"px";ar.appendChild(p);
      requestAnimationFrame(()=>{p.style.transform=`translate(${x2-x1}px,${y2-y1}px) rotate(540deg)`;});
      setTimeout(()=>{p.remove();sndHit();hit(v,e.dmg,e.crit);},520);}
    await sleep(900);a.querySelector("svg").setAttribute("class","masc st-idle");
  }
  function hit(v,dmg,crit){const el=document.getElementById("dm"+v);if(!el)return;hpShow[v]=Math.max(0,hpShow[v]-dmg);const sv=el.querySelector("svg");sv.setAttribute("class","masc st-hit");
    const [x,y]=pos(v);const f=document.createElement("div");f.className="dmg"+(crit?" crit":"");f.textContent="−"+dmg+(crit?" CRITIQUE !":"");f.style.left=x+"px";f.style.top=(y-60)+"px";ar.appendChild(f);setTimeout(()=>f.remove(),1300);
    const bar=document.getElementById("hp"+v);if(bar){bar.style.width=hpShow[v]+"%";bar.parentElement.nextElementSibling.textContent=hpShow[v]+" PV";}
    setTimeout(()=>sv.setAttribute("class","masc "+(hpShow[v]<=0?"st-ko":"st-idle")),600);}
}
/* ---------------- COFFRE ---------------- */
function coffreTry(k,code){
  const c=G.cur;const s=c.safe[k]=c.safe[k]||{};if(s.open)return;if(s.lock&&s.lock>now())return;
  if(!/^\d{4}$/.test(code))return;
  s.att=(s.att||0)+1;
  if(code===c.code){s.open=true;c.opened++;s.rank=c.opened;s.t=now()-c.startAt;s.fb=4;sndVault();}
  else{let n=0;for(let i=0;i<4;i++)if(code[i]===c.code[i])n++;s.fb=n;s.best=Math.max(s.best||0,n);s.lock=now()+6000;sndKo();}
  s.lastAt=now();pushState();updVaults(true);
  if(c.opened>=3)setTimeout(closeQ,1200);
}
function updVaults(force){const c=G.cur;const w=document.getElementById("vaults");if(!w)return;const key=JSON.stringify(c.safe)+Math.floor(now()/1000);if(!force&&w.dataset.k===key)return;w.dataset.k=key;w.innerHTML=G.teams.map((t,k)=>vaultHTML(k,c.safe[k],{name:t.name})).join("");}

function plateauNext(){
  const c=G.cur;const P=c.pl;
  c.i++;if(c.i>=P.total)return endGame();
  G.qc++;c.qid="pl"+G.qc+Math.random().toString(36).slice(2,5);
  Object.assign(c,{answers:{},results:null,correctLabel:null,payload:{},startAt:null});
  P.turn=c.i;P.active=c.i%3;P.dice=null;P.msg=null;P.hl=null;P.card=null;
  c.phase="roll";c.dur=c.baseDur;renderQ();pushState();
}
async function plateauRoll(){
  const c=G.cur;const P=c.pl;if(c.phase!=="roll")return;
  c.phase="move";const v=rnd(1,6);P.dice=v;pushState();renderQ();sndDice();
  await sleep(1100);
  const k=P.active;let passed=false;
  for(let s=0;s<v;s++){P.pos[k]=(P.pos[k]+1)%20;if(P.pos[k]===0&&s<v-1)passed=true;moveTok(k);sndCoin();await sleep(300);}
  if(passed||P.pos[k]===0){G.teams[k].score+=50;c.gained[k]+=50;floatOnTok(k,"+50 Départ");}
  plateauLand();
}
function moveTok(k){const P=G.cur.pl;const el=document.getElementById("tok"+k);if(!el)return;const [x,y]=cellPos(P.pos[k]);el.style.left=`calc(${x*16.666}% + ${8+k*24}px)`;el.style.top=`calc(${y*16.666}% + ${30+(k%2)*14}px)`;el.classList.remove("hop");void el.offsetWidth;el.classList.add("hop");}
function floatOnTok(k,t){const el=document.getElementById("tok"+k);if(!el)return;const r=el.getBoundingClientRect();floatTxt(r.left,r.top-10,t);}
function plateauLand(){
  const c=G.cur;const P=c.pl;const k=P.active;const cell=GD.plateau[P.pos[k]];P.hl=P.pos[k];

function plateauClose(){
  const c=G.cur;const P=c.pl;const k=P.active;const cell=GD.plateau[P.pos[k]];const R={};
  for(let t=0;t<3;t++){const r=qcmRes(c,t);
    if(t===k){
      if(cell.k==="dgccrf"){r.pts=r.ok?150:-100;r.label=(r.ok?"Contrôle réussi : ":"Contrôle raté : ")+r.label;}
      else{const ow=P.owner[P.pos[k]];
        if(r.ok&&ow==null){P.owner[P.pos[k]]=k;r.pts=100;r.label="Achète « "+cell.n+" » · "+r.label;}
        else if(r.ok&&ow===k){r.pts=60;r.label="Loyer encaissé chez soi · "+r.label;}
        else if(r.ok){r.pts=50;r.label="Évite le loyer · "+r.label;}
        else if(ow!=null&&ow!==k){const rent=Math.round(cell.v/2);r.pts=-rent;G.teams[ow].score+=rent;c.gained[ow]+=rent;r.label=`Paie ${rent} pts de loyer à ${G.teams[ow].name}`;}
        else{r.pts=0;}
      }
    }else{r.pts=r.ok?30:0;}
    R[t]=r;}
  for(let t=0;t<3;t++){G.teams[t].score+=R[t].pts;c.gained[t]+=R[t].pts;}
  if(R[k].ok)sndOk();else sndKo();
  c.results=R;c.phase="reveal";checkGrades();pushState();renderQ();
}

/* ---------- piste de course (central) ---------- */
function startTrack(){
  const cv=document.getElementById("trackCv");if(!cv)return;const x=cv.getContext("2d");const c=G.cur;const W=cv.width,H=cv.height;
  const shown=[0,1,2].map(k=>{const p=(c.prog&&c.prog[k])||{};return Math.min(1,(p.d||0)/(p.len||c.payload.n*12+8));});const imgs=G.teams.map(t=>mascotImg(t.m));const t0=now();
  function f(){
    if(!document.getElementById("trackCv")){RAF=null;return;}
    const tt=(now()-t0)/1000;x.clearRect(0,0,W,H);
    const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#1E3A8A");sky.addColorStop(1,"#0B1F3A");x.fillStyle=sky;x.fillRect(0,0,W,H);
    for(let i=0;i<14;i++){const bx=((i*97-tt*20)%(W+120)+W+120)%(W+120)-60;const bh=60+(i*37)%90;x.fillStyle="#13294B";x.fillRect(bx,90-bh*.5,70,bh);x.fillStyle="#FDE68A";for(let w=0;w<6;w++)if((i+w)%3)x.fillRect(bx+8+(w%3)*20,96-bh*.5+Math.floor(w/3)*22,8,10);}
    const L=110,R=W-70;
    for(let k=0;k<3;k++){
      const y=130+k*100;x.fillStyle="#1F2937";x.fillRect(L-40,y-34,R-L+80,68);x.fillStyle=TEAMC[k]+"33";x.fillRect(L-40,y-34,R-L+80,68);
      x.strokeStyle="#ffffff22";x.setLineDash([18,14]);x.lineDashOffset=-tt*60;x.beginPath();x.moveTo(L-40,y+34);x.lineTo(R+40,y+34);x.stroke();x.setLineDash([]);
      const p=(c.prog&&c.prog[k])||{};const len=p.len||c.payload.n*12+8;const tgt=Math.min(1,(p.d||0)/len);shown[k]+=(tgt-shown[k])*.08;
      for(let gI=1;gI<=c.payload.n;gI++){const gx=L+(R-L)*(gI*12/len);x.fillStyle="#ffffff44";x.fillRect(gx-2,y-30,4,60);}
      const mx=L+(R-L)*shown[k];
      x.fillStyle=TEAMC[k];x.globalAlpha=.35;x.fillRect(L-40,y-6,mx-L+40,12);x.globalAlpha=1;
      const bob=Math.abs(Math.sin(tt*10+k))*8*(c.phase==="question"&&!p.fin?1:0);
      if(imgs[k].complete)x.drawImage(imgs[k],mx-38,y-58-bob,76,85);
      x.fillStyle="#fff";x.font="800 18px Segoe UI";x.textAlign="left";x.fillText(G.teams[k].name+"  ·  "+(p.ok||0)+" ✔  "+(p.ko||0)+" ✘",L-34,y-40);
      if(p.fin){x.fillStyle="#FDE047";x.font="900 22px Segoe UI";x.fillText("🏁 ARRIVÉE",R-150,y-40);}
    }
    for(let i=0;i<12;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?"#fff":"#111";x.fillRect(R+28+j*12,92+i*28,12,28);}
    RAF=requestAnimationFrame(f);
  }
  stopRAF();RAF=requestAnimationFrame(f);
}
/* ---------- tours (central) ---------- */
function startTowers(){
  const cv=document.getElementById("towerCv");if(!cv)return;const x=cv.getContext("2d");const c=G.cur;const W=cv.width,H=cv.height;const imgs=G.teams.map(t=>mascotImg(t.m));let sc=1;
  function f(){
    if(!document.getElementById("towerCv")){RAF=null;return;}
    const P=c.prog||{};const mx=Math.max(4,...[0,1,2].map(k=>(P[k]&&P[k].f)||0));
    const want=Math.min(1,(H-150)/(mx*34));sc+=(want-sc)*.06;
    const sky=x.createLinearGradient(0,0,0,H);const hgt=Math.min(1,mx/16);sky.addColorStop(0,hgt>.6?"#0B1026":"#38BDF8");sky.addColorStop(1,hgt>.6?"#312E81":"#BAE6FD");x.fillStyle=sky;x.fillRect(0,0,W,H);
    x.fillStyle="#4D7C0F";x.fillRect(0,H-40,W,40);
    for(let k=0;k<3;k++){const cx=W*(k+.5)/3;const p=P[k]||{ws:[]};const ws=p.ws||[];
      x.save();x.translate(cx,H-40);x.scale(sc,sc);
      x.fillStyle="#57534E";x.fillRect(-110,0,220,14);
      ws.forEach((b,i)=>{const [ox,w]=b;const y=-(i+1)*34;const g=x.createLinearGradient(0,y,0,y+34);g.addColorStop(0,TEAMC[k]);g.addColorStop(1,mix(TEAMC[k],.4,"#000000"));x.fillStyle=g;x.fillRect(ox-w/2,y,w,32);x.fillStyle="#FDE68A";for(let wx=ox-w/2+10;wx<ox+w/2-16;wx+=26)x.fillRect(wx,y+8,12,14);});
      const topY=-(ws.length)*34;const topX=ws.length?ws[ws.length-1][0]:0;
      if(imgs[k].complete)x.drawImage(imgs[k],topX-36,topY-82,72,80);
      x.restore();
      x.fillStyle="#fff";x.font="900 22px Segoe UI";x.textAlign="center";x.fillText(G.teams[k].name,cx,30);x.font="800 18px Segoe UI";x.fillStyle="#FDE047";x.fillText((p.f||0)+" étage"+((p.f||0)>1?"s":"")+(p.p?" · "+p.p+" ★":""),cx,54);}
    RAF=requestAnimationFrame(f);
  }
  stopRAF();RAF=requestAnimationFrame(f);
}

function teamOnMsg(m){
  if(!m)return;
  if(m.t==="pr"){if(TM.state&&m.qid===TM.state.qid)TM.rivals=m.prog;return;}
  if(m.t!=="st")return;const s=m.s;
  TM.state=s;
  if(TM.team===null)return;
  if(s.teams[TM.team].m)TM.myM=s.teams[TM.team].m;
  if(s.prog)TM.rivals=s.prog;
  if(s.remMs!=null){const d=now()+s.remMs;const dk=s.qid+"|"+s.attempt+"|"+s.qphase;if(TM.deadline==null||Math.abs(d-TM.deadline)>600||TM.dlKey!==dk){TM.deadline=d;TM.dlKey=dk;}}
  else TM.deadline=null;
  if(TM.pend&&s.qid===TM.pend.qid){const ack=TM.pend.kind==="wg"?(s.wgot&&s.wgot[TM.team]):(s.got&&s.got[TM.team]);if(ack)TM.pend=null;}
  if(s.rc&&s.qid===TM.qid){(s.rc[TM.team]||[]).forEach(i=>delete TM.cpend[i]);}
  if(TM.creating)return;
  renderTeamIfNeeded(false);
}
function renderTeamIfNeeded(force){
  const s=TM.state;if(!s)return;
  const key=s.phase+"|"+(s.qid||"")+"|"+(s.qphase||"")+"|"+(s.attempt||0)+"|"+(s.phase==="intro"?s.introGame:"")+"|"+(s.wagers?"w":"")+"|"+(s.game==="plateau"&&s.pl?s.pl.dice:"")+"|"+(s.teams[TM.team].m?1:0);
  if(s.qid!==TM.qid){TM.qid=s.qid;TM.sent=false;TM.tri=[];TM.ord=[];TM.pend=null;TM.ci=0;TM.cpend={};TM.wsent=false;TM.vflags={};stopTeamGame();TM.rivals=null;TM.code4=[0,0,0,0];}
  if(!force&&TM.key===key){
    updHead();
    if(s.game==="mot"&&s.qphase==="question"){const m=document.getElementById("maskT");if(m)m.textContent=s.mask;}
    if(s.game==="qsj"&&s.qphase==="question"){const m=document.getElementById("cluesT");if(m)m.innerHTML=cluesHTML(s.clues);}
    if(s.game==="coffre"&&s.qphase==="question")updTeamVault();
    return;
  }
  TM.key=key;renderTeam();
}
function cluesHTML(cl){return (cl||[]).map((c,i)=>`<div class="triitem" style="font-size:21px"><span>🔎 Indice ${i+1} : ${esc(c)}</span></div>`).join("");}
function teamHead(){const s=TM.state,t=Object.assign({},s.teams[TM.team]);t.m=t.m||TM.myM;const gr=grade(t.score);return `<div class="thead tc${TM.team}"><span class="thm">${mascotSVG(t.m,{size:44,state:"idle",level:gr.i})}</span><span>${esc(t.name)}<small> · ${t.m?esc(t.m.name)+" · ":""}${gr.name}</small></span><span id="tscore">${t.score} pts</span></div>`;}
function updHead(){const el=document.getElementById("tscore");if(el&&TM.state)el.textContent=TM.state.teams[TM.team].score+" pts";}
function remT(){return TM.deadline==null?null:(TM.deadline-now())/1000;}
function teamTimer(){
  const s=TM.state;if(!s||TM.team===null)return;
  if(TM.pend&&now()-TM.pend.at>1200){TM.pend.at=now();Net.send(TM.pend.m);}
  const cp=Object.values(TM.cpend);if(cp.length&&(!TM.cpAt||now()-TM.cpAt>1200)){TM.cpAt=now();cp.forEach(m=>Net.send(m));}
  const tw=document.getElementById("ttw");
  if(!tw||!["question","buzz","wager"].includes(s.qphase))return;
  const r=remT();if(r===null)return;tw.innerHTML=timerSVG(r,s.dur);
  if(r<=0&&s.qphase==="question"&&!TM.sent&&!SELF_PACED.includes(s.game)&&s.game!=="coffre"){
    if(s.game==="tri"&&TM.tri.some(x=>x!=null))return sendAns(TM.tri.map(x=>x??-1),true);
    if(s.game==="ordre"&&TM.ord.some(x=>x!=null))return sendAns(TM.ord.map(x=>x??-1),true);
    if(s.game==="visite")return sendAns(Object.keys(TM.vflags).filter(k=>TM.vflags[k]),true);
    lockTeam("⏱️ Temps écoulé !");
  }
  if(r<=0&&s.qphase==="question"&&s.game==="chrono"){const z=document.getElementById("tz");if(z&&!z.dataset.end){z.dataset.end=1;z.innerHTML=`<div class="verdict neu">⏱️ Fin de la manche ! Regardez l'écran central.</div>`;}}
  if(r<=0&&s.qphase==="wager"&&!TM.wsent)lockTeam("⏱️ Temps écoulé : mise de 0 point.");
  if(r<=0&&s.qphase==="buzz"){const b=document.getElementById("bzb");if(b&&!b.disabled){b.disabled=true;b.textContent="Temps écoulé";}}
  if(s.game==="coffre"&&s.qphase==="question")updTeamVault();
}
function lockTeam(msg){document.querySelectorAll("#tz button,#tz input,#tz select").forEach(e=>e.disabled=true);const m=document.getElementById("tmsg");if(m)m.innerHTML=`<div class="verdict neu">${msg}</div>`;}
function sendAns(v,auto){
  if(TM.sent)return;const r=remT();
  if(!auto&&r!==null&&r<-0.3){lockTeam("⏱️ Temps écoulé !");return;}
  TM.sent=true;lockTeam(auto?"⏱️ Temps écoulé : votre réponse a été envoyée.":"✔ Réponse envoyée. Regardez l'écran central !");
  const m={t:"ans",qid:TM.state.qid,team:TM.team,v};
  TM.pend={qid:m.qid,m,at:now(),kind:"ans"};Net.send(m);
}
function sendWager(){
  if(TM.wsent)return;const s=TM.state;const mx=s.wmax[TM.team];
  let w=parseInt(document.getElementById("wgIn").value,10);if(isNaN(w))w=0;w=Math.max(0,Math.min(mx,w));
  TM.wsent=true;lockTeam("✔ Mise de "+w+" points envoyée !");
  const m={t:"wg",qid:s.qid,team:TM.team,w};TM.pend={qid:m.qid,m,at:now(),kind:"wg"};Net.send(m);
}
function setWager(v){const el=document.getElementById("wgIn");if(el&&!el.disabled)el.value=v;}
function sendBuzz(){
  const s=TM.state;const b=document.getElementById("bzb");b.disabled=true;b.textContent="BUZZÉ !";sndBuzz();
  const m={t:"bz",qid:s.qid,attempt:s.attempt,team:TM.team};Net.send(m);setTimeout(()=>Net.send(m),500);
}
function chronoAnswer(v){
  const s=TM.state;const r=remT();if(r!==null&&r<=0)return;
  const i=TM.ci;const m={t:"ca",qid:s.qid,team:TM.team,i,v};TM.cpend[i]=m;Net.send(m);
  TM.ci++;renderChronoItem();
}
function renderChronoItem(){
  const s=TM.state;const z=document.getElementById("tz");if(!z)return;const items=s.payload.items;
  if(TM.ci>=items.length){z.innerHTML=`<div class="verdict ok">🏁 Toutes les questions sont faites ! Attendez la fin du chrono.</div>`;return;}
  const it=items[TM.ci];
  z.innerHTML=`<div class="qnum">Question ${TM.ci+1} / ${items.length}</div><div class="qtext" style="font-size:28px">${esc(it.t)}</div><div class="opts">${it.o.map((o,j)=>`<button class="opt o${it.o.length===2?(j?0:3):j}" onclick="chronoAnswer(${j})"><span class="sh">${it.o.length===2?(j?"✘":"✔"):"▲◆●■"[j]}</span>${esc(o)}</button>`).join("")}</div>`;
}
function waitingHTML(msg){const t=TM.state.teams[TM.team];return `<div class="waiting"><div class="wm">${mascotSVG(t.m||TM.myM,{size:170,state:"idle",level:t.lvl||0})}</div>${msg}<div class="mt"><button class="btn ghost sm" onclick="openCreator()">✏️ Modifier ma mascotte</button></div></div>`;}
function renderTeam(){
  const s=TM.state;let h=teamHead();const me=s.teams[TM.team];
  if(!me.m&&!TM.myM){openCreator();return;}
  if(s.phase==="lobby"||s.phase==="menu")h+=waitingHTML(`👀 Partie rejointe !<br>Regardez l'écran central : le prochain jeu va commencer.`);
  else if(s.phase==="intro")h+=`<div class="card center"><div style="font-size:70px">${s.introIc||""}</div><h1 class="big">${esc(s.introGame)}</h1><p style="font-size:20px;line-height:1.5">${esc(s.introRules)}</p>${["course","tour"].includes(s.introId)?`<p class="sub">💡 Gardez la souris ou le clavier en main : vous allez piloter !</p>`:""}</div>`;
  else if(s.phase==="gameend")h+=`<div class="card center"><div class="wm">${mascotSVG(me.m,{size:150,state:(s.gained&&s.gained[TM.team]>0)?"happy":"sad",level:me.lvl||0})}</div><h1 class="big">Fin du jeu : ${esc(s.gtitle)}</h1><p class="sub" style="font-size:26px">Votre équipe a marqué <b style="color:var(--amber)">${s.gained?s.gained[TM.team]:0} points</b> dans ce jeu.</p></div>`;
  else if(s.phase==="final"){const o=[0,1,2].sort((a,b)=>s.teams[b].score-s.teams[a].score);const rk=o.indexOf(TM.team)+1;h+=`<div class="card center"><div class="wm">${mascotSVG(me.m,{size:180,state:rk===1?"happy":"idle",level:me.lvl||0})}</div><h1 class="big">${rk===1?"🏆 Victoire !":"Bravo !"}</h1><p style="font-size:30px">Votre équipe termine <b>${rk===1?"1re":rk+"e"}</b> avec ${me.score} points.</p></div>`;if(rk===1)confetti();}
  else if(s.phase==="game"&&s.payload){h+=teamGameHTML(s);}
  else h+=`<div class="waiting">Regardez l'écran central…</div>`;
  app().innerHTML=h;
  afterTeamRender(s);
  teamTimer();
}
function teamGameHTML(s){
  const P=s.payload,qp=s.qphase,g=s.game;let h="";
  const lab=g==="chrono"?"Manche":g==="plateau"?"Tour":"";
  h+=`<div class="card tgame tg-${g}"><div class="qhead"><div class="qnum">${esc(s.gtitle)}${["course","tour"].includes(g)?"":" · "+lab+" "+s.num+" / "+s.total}</div><div id="ttw"></div></div>`;
  if(g==="plateau")return h+teamPlateauHTML(s)+`</div>`;
  if(qp==="ready"){h+=`<div class="waiting">${g==="mise"&&s.wagers?"Mises enregistrées : votre mise est de <b style='color:var(--amber)'>"+s.wagers[TM.team]+" points</b>.<br><br>La question arrive…":["course","tour"].includes(g)?"Préparez-vous… le départ est donné par le formateur !":"Prêts ? Ça va commencer…"}</div></div>`;return h;}
  if(qp==="wager"){const mx=s.wmax[TM.team];
    return h+`<div id="tz"><div class="qtext">💰 Combien misez-vous ? (maximum ${mx} points)</div><div class="row">${[0,.25,.5,1].map(f=>Math.round(mx*f)).map(v=>`<button class="btn ghost" onclick="setWager(${v})">${v}</button>`).join("")}</div><div class="row mt"><input id="wgIn" type="number" min="0" max="${mx}" value="${Math.round(mx/2)}" style="max-width:220px;font-size:32px;text-align:center"><button class="btn amb" onclick="sendWager()">Valider ma mise</button></div></div><div id="tmsg"></div></div>`;}
  if(qp==="question"){
    h+=`<div id="tz">`;
    if(QCMLIKE.includes(g))h+=(g==="duel"?duelMeHTML(s):"")+`<div class="qtext">${esc(P.t)}</div><div class="opts">${P.o.map((o,j)=>`<button class="opt o${j}" onclick="this.classList.add('sel');sendAns(${j})"><span class="sh">${"▲◆●■"[j]}</span>${"ABCD"[j]}. ${esc(o)}</button>`).join("")}</div>`;
    if(g==="vf")h+=`<div class="qtext">${esc(P.t)}</div><div class="opts"><button class="opt o3" onclick="this.classList.add('sel');sendAns(true)"><span class="sh">✔</span>VRAI</button><button class="opt o0" onclick="this.classList.add('sel');sendAns(false)"><span class="sh">✘</span>FAUX</button></div>`;
    if(g==="num")h+=`<div class="qtext">${esc(P.t)}</div><div class="row"><input id="numIn" type="number" step="any" style="max-width:300px;font-size:34px;text-align:center"><b style="font-size:24px">${esc(P.u)}</b><button class="btn amb" onclick="const v=document.getElementById('numIn').value;if(v!=='')sendAns(v)">Valider</button></div>`;
    if(g==="mot")h+=`<div class="qtext">${esc(P.d)}</div><div class="mask" id="maskT">${esc(s.mask)}</div><div class="row"><input id="motIn" placeholder="Votre mot (un seul essai)" style="max-width:460px;font-size:26px;text-transform:uppercase"><button class="btn amb" onclick="const v=document.getElementById('motIn').value.trim();if(v)sendAns(v)">Valider</button></div>`;
    if(g==="qsj")h+=`<div class="qtext">Qui suis-je ?</div><div id="cluesT">${cluesHTML(s.clues)}</div><div class="row mt"><input id="qsjIn" placeholder="Votre réponse (un seul essai)" style="max-width:460px;font-size:24px;text-transform:uppercase"><button class="btn amb" onclick="const v=document.getElementById('qsjIn').value.trim();if(v)sendAns(v)">Valider</button></div>`;
    if(g==="tri"){if(!TM.tri.length)TM.tri=P.items.map(()=>null);h+=`<div class="qtext" style="font-size:26px">${esc(P.t)}</div>${P.items.map((it,j)=>`<div class="triitem"><span>${esc(it)}</span><span class="bt">${P.c.map((c,ci)=>`<button id="tb${j}_${ci}" class="${TM.tri[j]===ci?"on":""}" onclick="triSet(${j},${ci})">${esc(c)}</button>`).join("")}</span></div>`).join("")}<button class="btn amb mt" onclick="sendAns(TM.tri.map(x=>x??-1))">Valider mon classement</button>`;}
    if(g==="ordre"){const n=P.items.length;if(!TM.ord.length)TM.ord=P.items.map(()=>null);h+=`<div class="qtext" style="font-size:26px">${esc(P.t)}</div>${P.items.map((it,j)=>`<div class="triitem"><span>${esc(it)}</span><select style="width:110px" onchange="ordSet(${j},this.value)"><option value="">Rang…</option>${Array.from({length:n},(_,r)=>`<option value="${r}" ${TM.ord[j]===r?"selected":""}>${r+1}</option>`).join("")}</select></div>`).join("")}<button class="btn amb mt" onclick="sendAns(TM.ord.map(x=>x??-1))">Valider mon ordre</button>`;}
    if(g==="course")h+=`<div class="runq" id="runq"></div><div class="runwrap"><canvas id="runCv" width="1100" height="520"></canvas><div class="runhud" id="runhud"></div></div><div class="lanebtns">${["A","B","C"].map((l,i)=>`<button class="lb l${i}" onclick="RUN&&RUN.lane(${i})">${l}</button>`).join("")}</div><p class="small center">Changez de couloir avec les flèches ← → du clavier, ou cliquez sur A, B, C.</p>`;
    if(g==="tour")h+=`<div class="towerwrap"><canvas id="stackCv" width="760" height="560"></canvas><div class="stackq" id="stackq"></div></div><p class="small center">Quand l'étage se balance : clic, toucher ou barre Espace pour le lâcher.</p>`;
    if(g==="visite"){const S=GD.visite[P.sc];h+=`<div class="qtext sm">🔍 ${esc(S.title)}</div><p class="small">${esc(S.sub)} Cliquez pour signaler, recliquez pour retirer.</p><div id="vscene" class="scenewrap">${sceneSVG(P.sc,{click:true,flags:TM.vflags})}</div><div class="row mt"><b id="vcount">0 signalement</b><button class="btn amb" onclick="sendAns(Object.keys(TM.vflags).filter(k=>TM.vflags[k]))">Valider mes signalements</button></div>`;}
    if(g==="immeuble"){if(P.k==="cls")h+=`<div class="bldsvg sm">${buildingSVG(P.el,{})}</div><div class="qtext sm">${esc(P.t)}</div><div class="opts o3c">${P.o.map((o,j)=>`<button class="opt o${j}" onclick="this.classList.add('sel');sendAns(${j})"><span class="sh">${"▲◆●"[j]}</span>${esc(o)}</button>`).join("")}</div>`;
      else h+=`<div class="qtext sm">${esc(P.t)}</div>${lotsTable()}<div class="row mt"><input id="numIn" type="number" step="any" style="max-width:300px;font-size:32px;text-align:center"><b style="font-size:24px">€</b><button class="btn amb" onclick="const v=document.getElementById('numIn').value;if(v!=='')sendAns(v)">Valider</button></div>`;}
    if(g==="coffre")h+=teamVaultHTML(s);
    h+=`</div><div id="tmsg"></div></div>`;return h;
  }
  if(qp==="buzz"||qp==="buzzed"){
    const ex=(s.excluded||[]).includes(TM.team);
    h+=`<div class="qtext">${esc(P.t)}</div><div class="center">`;
    if(qp==="buzzed")h+=`<div class="verdict ${s.buzzed===TM.team?"ok":"neu"}">${s.buzzed===TM.team?"🎤 À vous ! Répondez à l'oral":"🔴 "+esc(s.teams[s.buzzed].name)+" a buzzé"}</div>`;
    else h+=`<button class="buzz" id="bzb" ${ex?"disabled":""} onclick="sendBuzz()">${ex?"Exclus sur cette question":"BUZZ"}</button>`;
    return h+`</div></div>`;
  }
  if(qp==="reveal"){
    const r=s.results&&s.results[TM.team];const me=s.teams[TM.team];
    const qtxt=g==="qsj"?"Qui suis-je ?":["chrono","course","tour"].includes(g)?"Fin de la manche":g==="visite"?GD.visite[P.sc].title:g==="coffre"?"Le coffre":(P.t||P.d||"");
    h+=`<div class="rev"><div class="rvm">${mascotSVG(me.m,{size:150,state:r&&r.pts>0?"happy":"sad",level:me.lvl||0})}</div><div style="flex:1">`;
    if(g==="buzz")h+=`<div class="qtext">${esc(P.t)}</div><div class="verdict ${r?"ok":"neu"}">${r?"✔ +150 points !":"Réponse : "+esc(s.correct)}</div>`;
    else h+=`<div class="qtext sm">${esc(qtxt)}</div><div class="verdict ${r&&r.ok?"ok":(r&&r.part?"neu":"ko")}">${r&&r.ok?"✔ Bravo !":(r&&r.part?"◐ "+esc(r.label):"✘ "+(r?esc(r.label):"Raté"))} <span style="font-size:30px">${r&&r.pts<0?"":"+"}${r?r.pts:0} pts</span></div>${s.correct&&!["tri"].includes(g)?`<div class="answer-box">Bonne réponse : ${esc(s.correct)}</div>`:""}`;
    if(g==="duel"&&s.hp)h+=`<p class="sub">Points de vie : ${s.teams.map((t,k)=>`<b style="color:${TEAMC[k]}">${esc(t.name)} ${s.hp[k]}</b>`).join(" · ")}</p>`;
    if(g==="visite"&&s.tf){const S=GD.visite[P.sc];h+=`<div class="expl sm">${S.spots.filter(p=>p.bad).map(p=>`<div class="ex"><b>${s.tf[TM.team].includes(p.id)?"✅":"❌"} ${esc(p.l)}</b><span>${esc(p.why)}</span></div>`).join("")}</div>`;}
    return h+`</div></div></div>`;
  }
  return h+`<div class="waiting">Regardez l'écran central…</div></div>`;
}
function afterTeamRender(s){
  if(s.phase!=="game")return;
  if(s.qphase==="question"&&s.game==="chrono")renderChronoItem();
  if(s.qphase==="question"&&TM.sent&&!SELF_PACED.includes(s.game))lockTeam("✔ Réponse envoyée. Regardez l'écran central !");
  if(s.qphase==="wager"&&TM.wsent)lockTeam("✔ Mise envoyée !");
  if(s.qphase==="question"&&s.game==="course")startRunner(s);
  if(s.qphase==="question"&&s.game==="tour")startStacker(s);
  if(s.qphase==="question"&&s.game==="visite")updVCount();
  if(s.qphase==="question"&&s.game==="coffre")updTeamVault(true);
}
function triSet(j,ci){if(TM.sent)return;TM.tri[j]=ci;TM.state.payload.c.forEach((c,k)=>{const b=document.getElementById(`tb${j}_${k}`);if(b)b.classList.toggle("on",k===ci);});}
function ordSet(j,v){if(TM.sent)return;TM.ord[j]=v===""?null:+v;}

  if(TM.sent)return;const g=e.target.closest(".spot");if(!g)return;const id=g.dataset.id;TM.vflags[id]=!TM.vflags[id];sndCoin();
  const w=$("#vscene");if(w)w.innerHTML=sceneSVG(TM.state.payload.sc,{click:true,flags:TM.vflags});updVCount();
}
function updVCount(){const n=Object.values(TM.vflags).filter(Boolean).length;const el=$("#vcount");if(el)el.textContent=n+" signalement"+(n>1?"s":"");}
/* ---------------- duel ---------------- */
function duelMeHTML(s){const hp=s.hp?s.hp[TM.team]:100;return `<div class="duelme"><div>${mascotSVG(s.teams[TM.team].m,{size:80,state:hp<=0?"ko":"idle"})}</div><div class="hpb big"><i style="width:${hp}%;background:${TEAMC[TM.team]}"></i></div><b>${hp} PV</b></div>${hp<=0?`<p class="small">Votre mascotte est K.O., mais chaque bonne réponse rapporte encore des points !</p>`:""}`;}
/* ---------------- plateau ---------------- */
function teamPlateauHTML(s){
  const P=s.pl,qp=s.qphase;const act=P.active===TM.team;const at=s.teams[P.active];let h="";
  const cell=GD.plateau[P.pos[TM.team]];
  if(qp==="roll")h+=act?`<div class="center"><div class="wm">${mascotSVG(s.teams[TM.team].m,{size:150,state:"happy"})}</div><button class="btn amb dicebtn" onclick="this.disabled=true;Net.send({t:'roll',qid:TM.state.qid,team:TM.team});setTimeout(()=>{this.disabled=false},3000)">🎲 Lancer les dés !</button><p class="small">Vous êtes sur : ${esc(cell.n)}</p></div>`:`<div class="waiting">${mascotSVG(at.m,{size:120,state:"idle"})}<br>Au tour de <b style="color:${TEAMC[P.active]}">${esc(at.name)}</b> de lancer les dés…<br><span class="small">Restez prêts : tout le monde répond à la question !</span></div>`;
  else if(qp==="move")h+=`<div class="center">${diceHTML(P.dice,true)}<p class="sub">${esc(at.name)} avance de ${P.dice} case${P.dice>1?"s":""}…</p></div>`;

    T.ws.forEach((b,i)=>blk(b[0],-(i+1)*BH,b[1]));
    const top=-(h)*BH;const tx=h?T.ws[h-1][0]:0;
    if(T.mode==="drop"){const y=-(h+1)*BH-90;x.strokeStyle="#CBD5E1";x.lineWidth=3;x.beginPath();x.moveTo(T.mv.x,y-200);x.lineTo(T.mv.x,y);x.stroke();blk(T.mv.x,y,T.mv.w);x.fillStyle="#ffffff55";x.fillRect(T.mv.x-T.mv.w/2,-(h+1)*BH,T.mv.w,2);}
    T.falls=T.falls.filter(f=>f.y<400);T.falls.forEach(f=>{f.vy+=900*dt;f.y+=f.vy*dt;f.r+=f.vr;x.save();x.translate(f.x,f.y+BH/2);x.rotate(f.r);blk(0,-BH/2,f.w,.85);x.restore();});
    x.drawImage(img,tx-40,top-92,80,90);
    T.parts=T.parts.filter(p=>p.l>0);T.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l-=dt;x.fillStyle=`rgba(253,224,71,${p.l})`;x.fillRect(p.x,p.y,6,6);});
    x.restore();
    x.fillStyle="rgba(2,6,23,.6)";x.beginPath();x.roundRect(10,10,330,104,12);x.fill();x.fillStyle="#fff";x.font="900 26px Segoe UI";x.textAlign="left";x.fillText(`🏢 ${h} étage${h>1?"s":""}   ★ ${T.p}`,20,40);
    const rv=TM.rivals||{};x.font="800 17px Segoe UI";let ri=0;[0,1,2].forEach(k=>{if(k===TM.team)return;const r=rv[k];x.fillStyle=TEAMC[k];x.fillText(`${TM.state.teams[k].name} : ${r?r.f||0:0} étage${r&&r.f>1?"s":""}`,20,72+ri*26);ri++;});
    if(T.fx&&T.fx.t>0){T.fx.t-=dt;x.globalAlpha=Math.min(1,T.fx.t*2);x.fillStyle="#FDE047";x.font="900 46px Segoe UI";x.textAlign="center";x.fillText(T.fx.txt,W/2,H*.25);x.globalAlpha=1;}
  }
  STK=T;T.attach();T.raf=requestAnimationFrame(frame);send(true);
}
