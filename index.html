<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Grand Concours de l'Immo — version longue</title>
<style>
:root{
  --bg1:#071A2B; --bg2:#0B2E44; --teal:#0F766E; --teal2:#14B8A6; --amber:#F59E0B;
  --green:#16A34A; --red:#DC2626; --ink:#F8FAFC; --muted:#94A3B8; --card:#0F2A40; --line:#1E4060;
  --t0:#E11D48; --t1:#F59E0B; --t2:#0EA5A4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at top,#12406A 0%,var(--bg2) 35%,var(--bg1) 100%);min-height:100vh}
button{font-family:inherit}
#app{max-width:1400px;margin:0 auto;padding:18px 22px 40px}
.logo{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--amber)}
h1.big{font-size:clamp(30px,4vw,54px);margin:6px 0 4px;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.sub{color:var(--muted);font-size:17px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0A4F4A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0A4F4A}
.btn:disabled{background:#475569;box-shadow:none;cursor:not-allowed}
.btn.amb{background:var(--amber);color:#1F1300;box-shadow:0 4px 0 #A16207}
.btn.red{background:var(--red);box-shadow:0 4px 0 #7F1D1D}
.btn.grn{background:var(--green);box-shadow:0 4px 0 #14532D}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.card{background:rgba(15,42,64,.85);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
input,select{font-family:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#0A2236;color:var(--ink);width:100%}
label.l{display:block;font-weight:700;margin:12px 0 6px;color:#CBD5E1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.center{text-align:center}
.mt{margin-top:18px}
.hide{display:none!important}
.small{font-size:14px;color:var(--muted)}
code,pre{background:#04121F;border-radius:8px;padding:2px 6px;color:#A7F3D0;font-size:13px}
pre{padding:12px;overflow:auto;white-space:pre-wrap}
/* layout central */
.cwrap{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.scoreboard .team{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;margin:10px 0;font-weight:800;font-size:20px;border:3px solid transparent}
.scoreboard .team .pts{font-size:28px}
.tc0{background:linear-gradient(90deg,rgba(225,29,72,.35),rgba(225,29,72,.12));border-color:var(--t0)!important}
.tc1{background:linear-gradient(90deg,rgba(245,158,11,.35),rgba(245,158,11,.12));border-color:var(--t1)!important}
.tc2{background:linear-gradient(90deg,rgba(14,165,164,.35),rgba(14,165,164,.12));border-color:var(--t2)!important}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#475569;margin-right:8px}
.dot.on{background:#22C55E;box-shadow:0 0 10px #22C55E}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gtile{background:linear-gradient(160deg,#13405F,#0B2A40);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;position:relative;min-height:170px;transition:transform .15s,border-color .15s}
.gtile:hover{transform:translateY(-4px);border-color:var(--amber)}
.gtile .ic{font-size:40px}
.gtile h3{margin:6px 0 2px;font-size:22px}
.gtile .insp{color:var(--amber);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.gtile .meta{color:var(--muted);font-size:14px;margin-top:6px}
.gtile.done:after{content:"✓ JOUÉ";position:absolute;top:12px;right:12px;background:var(--green);font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:16px}
.qnum{font-weight:800;color:var(--amber);font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.qtext{font-size:clamp(24px,2.7vw,38px);font-weight:800;line-height:1.25;margin:14px 0 18px}
.timer{position:relative;width:110px;height:110px;flex:0 0 110px}
.timer svg{transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900}
.timer.warn .tv{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:14px;padding:18px 18px;border-radius:14px;font-size:clamp(18px,1.7vw,24px);font-weight:700;color:#fff;border:0;text-align:left;cursor:pointer;min-height:80px}
.opt .sh{flex:0 0 46px;height:46px;border-radius:10px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;font-size:24px}
.o0{background:#E11D48}.o1{background:#2563EB}.o2{background:#CA8A04}.o3{background:#16A34A}
.opt.dim{opacity:.28}
.opt.right{outline:5px solid #fff;box-shadow:0 0 25px rgba(255,255,255,.6)}
.opt.sel{outline:5px solid #fff}
.ansbar{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.ansbar .chip{flex:1 1 200px;padding:10px 14px;border-radius:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mask{font-family:"Courier New",monospace;font-weight:900;font-size:clamp(28px,4vw,56px);letter-spacing:.3em;text-align:center;margin:10px 0 18px;color:var(--amber);word-break:break-all}
.res td,.res th{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:19px}
.res th{color:var(--muted);font-size:14px;text-transform:uppercase}
table.res{width:100%;border-collapse:collapse}
.ok{color:#4ADE80;font-weight:800}.ko{color:#F87171;font-weight:800}
.answer-box{background:rgba(22,163,74,.18);border:2px solid var(--green);border-radius:14px;padding:12px 16px;font-size:22px;font-weight:800;margin:12px 0}
.triitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#0A2236;margin:8px 0;font-size:19px;font-weight:600}
.triitem .bt{display:flex;gap:8px}
.triitem .bt button{border:2px solid var(--line);background:#0F2A40;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:15px}
.triitem .bt button.on{background:var(--teal);border-color:var(--teal2)}
.buzz{width:min(360px,80vw);height:min(360px,80vw);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FF6B6B,#B91C1C 70%);color:#fff;font-size:56px;font-weight:900;box-shadow:0 14px 0 #7F1D1D,0 20px 40px rgba(0,0,0,.5);cursor:pointer}
.buzz:active{transform:translateY(10px);box-shadow:0 4px 0 #7F1D1D}
.buzz:disabled{background:#475569;box-shadow:0 8px 0 #1E293B;cursor:not-allowed;font-size:30px}
.flash{animation:flash .8s 3}
@keyframes flash{50%{background:rgba(245,158,11,.35)}}
/* équipe */
.thead{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-radius:16px;margin-bottom:18px;font-weight:900;font-size:22px}
.waiting{font-size:26px;text-align:center;color:var(--muted);padding:60px 10px}
.verdict{font-size:42px;font-weight:900;text-align:center;padding:24px;border-radius:18px;margin:14px 0}
.verdict.ok{background:rgba(22,163,74,.25)}.verdict.ko{background:rgba(220,38,38,.25)}.verdict.neu{background:rgba(148,163,184,.15);color:#E2E8F0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:30px 0}
.podium .p{width:220px;text-align:center;border-radius:16px 16px 0 0;padding:16px;font-weight:900;font-size:22px}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.status{position:fixed;bottom:10px;right:12px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
@media(max-width:900px){.cwrap,.grid2,.grid3,.games,.opts{grid-template-columns:1fr}}
</style>
</head>

/* ======================================================================
   4) RÉSEAU — Supabase Realtime (Broadcast), comme les jeux Stop microbes.
      Aucune table : les messages passent en direct entre les PC.
      Sans Supabase : mode test (plusieurs onglets d'un même navigateur).
   ====================================================================== */
const Net=(()=>{ let ch=null,bc=null,handler=null,mode='none';
  const waitLib=()=>new Promise(r=>{let n=0;const t=setInterval(()=>{if(window.supabase||++n>40){clearInterval(t);r(!!window.supabase);}},100);});
  async function open(code,onMsg){ handler=onMsg;
    if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY&&await waitLib()){ try{
      const cl=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY,{realtime:{params:{eventsPerSecond:40}}});
      ch=cl.channel('concoursimmo-'+code,{config:{broadcast:{self:false}}});
      ch.on('broadcast',{event:'m'},({payload})=>{if(handler)handler(payload);});
      await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('délai dépassé')),9000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(to);res();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){clearTimeout(to);rej(new Error(st));}});});
      mode='online';setNet(true,'En ligne (Supabase)');return mode;}catch(e){console.warn('Supabase indisponible',e);mode='error';} }
    try{bc=new BroadcastChannel('concoursimmo-'+code);bc.onmessage=e=>{if(handler)handler(e.data);};}catch(e){}
    if(mode!=='error')mode='local';
    setNet(mode==='local',mode==='local'?'Mode test (un seul ordinateur)':'Supabase injoignable');return mode;}
  function send(m){try{if(ch&&mode==='online')ch.send({type:'broadcast',event:'m',payload:m});else if(bc)bc.postMessage(m);}catch(e){}}
  return {open,send,get mode(){return mode;}};})();
function setNet(ok,msg){const el=document.getElementById("netStatus");if(el)el.textContent=(ok?"🟢 ":"🔴 ")+msg;}
const now=()=>Date.now();

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
let AC=null;
function beep(f=880,d=.12,type="sine",vol=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
const sndTick=()=>beep(1000,.06,"square",.06), sndEnd=()=>{beep(220,.5,"sawtooth",.15)}, sndOk=()=>{beep(660,.12);setTimeout(()=>beep(990,.2),120)}, sndBuzz=()=>beep(150,.6,"square",.2), sndJoin=()=>{beep(880,.1);setTimeout(()=>beep(1320,.12),70)};
function timerSVG(rem,dur){
  const r=48,c=2*Math.PI*r,frac=Math.max(0,Math.min(1,rem/dur));
  const col=rem<=5?"#EF4444":"#F59E0B";
  return `<div class="timer ${rem<=5?"warn":""}"><svg width="110" height="110"><circle cx="55" cy="55" r="${r}" stroke="#1E4060" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="${r}" stroke="${col}" stroke-width="10" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}" stroke-linecap="round"/></svg><div class="tv">${Math.ceil(Math.max(0,rem))}</div></div>`;
}
function confetti(){const cols=["#E11D48","#F59E0B","#0EA5A4","#22C55E","#3B82F6","#fff"];for(let i=0;i<140;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];d.style.animationDuration=(2.5+Math.random()*2.5)+"s";d.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),6500);}}
function fmtN(x){return String(Math.round(x*100)/100).replace(".",",");}

async function resumeSession(){

function sendState(){
  if(!G)return;const c=G.cur;
  const st={v:G.v,phase:G.phase,teams:G.teams.map(t=>({name:t.name,score:t.score}))};
  if(c&&G.phase==="game"){
    Object.assign(st,{game:c.game,gtitle:gameDef(c.game).title,qid:c.qid,num:c.i+1,total:c.list.length,qphase:c.phase,dur:c.dur,payload:c.payload,
      mask:c.mask||null,clues:c.clues||null,excluded:c.excluded||[],buzzed:c.buzzed??null,attempt:c.attempt||0,results:c.results||null,correct:c.correctLabel||null,
      got:[0,1,2].map(k=>!!(c.answers&&k in c.answers)),wgot:[0,1,2].map(k=>!!(c.wagers&&k in c.wagers)),wagers:c.wagerDone?c.wagers:null,wmax:c.wmax||null});
    if(c.game==="chrono"&&c.ca)st.rc=[0,1,2].map(k=>Object.keys(c.ca[k]).map(Number));
    if(c.startAt&&["question","buzz","wager"].includes(c.phase))st.remMs=c.startAt+c.dur*1000-now();
  }
  Object.assign(st,G.lastExtra||{});
  Net.send({t:"st",s:st});
}
function pushState(extra){G.lastExtra=extra||{};G.v++;saveG();sendState();}
const gameDef=id=>GAMES.find(g=>g.id===id);

function centralOnMsg(m){
  if(!G||!m)return;
  if(m.t==="hello"){sendState();return;}
  if(m.t==="join"){const k=m.team;if(!G.joined[k]){G.joined[k]=true;sndJoin();}markJoined();sendState();return;}
  const c=G.cur;if(!c||m.qid!==c.qid)return;
  const inTime=extra=>now()<=c.startAt+c.dur*1000+extra;
  if(m.t==="ans"&&c.phase==="question"&&!(m.team in c.answers)&&inTime(800)){
    c.answers[m.team]={v:m.v,t:Math.max(0,now()-c.startAt)};updChips();sendState();
  }
  if(m.t==="wg"&&c.phase==="wager"&&!(m.team in c.wagers)&&inTime(800)){
    const mx=c.wmax[m.team];c.wagers[m.team]=Math.max(0,Math.min(mx,Math.round(+m.w||0)));updChips(true);sendState();
  }
  if(m.t==="ca"&&c.phase==="question"&&c.game==="chrono"&&inTime(800)){
    if(!(m.i in c.ca[m.team])){c.ca[m.team][m.i]=m.v;updChrono();}
    sendState();
  }
  if(m.t==="bz"&&c.phase==="buzz"&&m.attempt===c.attempt&&!c.excluded.includes(m.team)&&inTime(500)){
    clearInterval(LOOP);c.buzzed=m.team;c.phase="buzzed";sndBuzz();pushState();renderQ();
  }
}

function draw(gid,n){
  const b=BANKOF(gid);
  const used=G.used[b]||[];const idx=BANK[b].map((_,i)=>i);
  let fresh=shuffle(idx.filter(i=>!used.includes(i)));
  if(fresh.length<n){G.used[b]=[];fresh=fresh.concat(shuffle(idx.filter(i=>!fresh.includes(i))));}
  const pick=fresh.slice(0,n);G.used[b]=(G.used[b]||[]).concat(pick);return pick;
}
function startGame(gid){
  const n=+$("#nq").value, dur=+$("#dq").value;
  const list=gid==="chrono"?Array.from({length:n},(_,i)=>i):draw(gid,n);
  G.cur={game:gid,list,i:-1,dur,baseDur:dur,gained:[0,0,0]};
  G.phase="game";nextQ();
}
function buildChronoItems(){
  const items=[],key=[];
  const vfs=draw("vf",15), qs=draw("qcm",15);
  vfs.forEach(i=>{const q=BANK.vf[i];items.push({t:q.t,o:["VRAI","FAUX"]});key.push(q.a?0:1);});
  qs.forEach(i=>{const q=BANK.qcm[i];const ord=shuffle([0,1,2,3]);items.push({t:q.t,o:ord.map(k=>q.o[k])});key.push(ord.indexOf(0));});
  const order=shuffle(items.map((_,i)=>i));
  return {items:order.map(i=>items[i]),key:order.map(i=>key[i])};
}
function nextQ(){
  clearInterval(LOOP);
  const c=G.cur;c.i++;
  if(c.i>=c.list.length)return endGame();
  const gid=c.game;const q=gid==="chrono"?null:BANK[BANKOF(gid)][c.list[c.i]];
  G.qc++;c.qid=gid+G.qc+Math.random().toString(36).slice(2,5);
  Object.assign(c,{answers:{},results:null,correctLabel:null,mask:null,clues:null,excluded:[],buzzed:null,attempt:1,lastTick:null,wagers:null,wagerDone:false,wmax:null,ca:null});
  c.dur=c.baseDur||gameDef(gid).dur;
  if(QCMLIKE.includes(gid)){c.order=shuffle([0,1,2,3]);c.payload={t:q.t,o:c.order.map(k=>q.o[k])};c.right=c.order.indexOf(0);c.correctLabel="ABCD"[c.right]+". "+q.o[0];}
  if(gid==="mise"){c.wagers={};c.wmax=G.teams.map(t=>miseMax(t.score));c.qpay=c.payload;c.payload={hidden:true};}
  if(gid==="vf"){c.payload={t:q.t};c.correctLabel=q.a?"VRAI":"FAUX";}
  if(gid==="num"){c.payload={t:q.t,u:q.u};c.correctLabel=q.a+" "+q.u;}
  if(gid==="mot"){const w=q.w;c.letters=[...w].map((ch,i)=>/[A-Z]/.test(ch)?i:-1).filter(i=>i>=0);c.revOrder=shuffle(c.letters);c.revealed=0;c.mask=maskOf(w,[]);c.payload={d:q.d,len:c.letters.length};c.correctLabel=w;c.step=5;}
  if(gid==="qsj"){c.step=Math.max(4,Math.floor(c.dur/4));c.clues=[q.c[0]];c.payload={n:q.c.length};c.correctLabel=q.w;}
  if(gid==="tri"){c.items=shuffle(q.items.map((it,k)=>k));c.payload={t:q.t,c:q.c,items:c.items.map(k=>q.items[k][0])};}
  if(gid==="ordre"){c.items=shuffle(q.items.map((it,k)=>k));c.payload={t:q.t,items:c.items.map(k=>q.items[k])};c.correctLabel=q.items.map((x,k)=>(k+1)+". "+x).join("   ");}
  if(gid==="buzz"){c.payload={t:q.t};c.correctLabel=q.r;}
  if(gid==="chrono"){const b=buildChronoItems();c.payload={items:b.items};c.key=b.key;c.ca={0:{},1:{},2:{}};}
  c.phase="ready";c.startAt=null;
  renderQ();pushState();
}
function maskOf(w,revIdx){return [...w].map((ch,i)=>/[A-Z]/.test(ch)?(revIdx.includes(i)?ch:"_"):(ch===" "?" ":ch)).join("");}
function launchQ(){
  const c=G.cur;
  if(c.game==="buzz")c.dur=c.attempt>1?10:c.baseDur;
  if(c.game==="mise"&&!c.wagerDone){c.dur=20;c.phase="wager";}
  else{if(c.game==="mise"){c.dur=c.baseDur;c.payload=c.qpay;}c.phase=c.game==="buzz"?"buzz":"question";}
  c.startAt=now();c.lastTick=null;
  pushState();renderQ();
  clearInterval(LOOP);LOOP=setInterval(tick,250);
}
function tick(){
  const c=G.cur;if(!c)return;
  const rem=(c.startAt+c.dur*1000-now())/1000;
  const tw=document.getElementById("tw");if(tw)tw.innerHTML=timerSVG(rem,c.dur);
  const s=Math.ceil(rem);if(rem>0&&s<=5&&c.lastTick!==s){c.lastTick=s;sndTick();}
  if(c.phase==="question"){
    const el=(now()-c.startAt)/1000;
    if(c.game==="mot"){const want=Math.min(c.letters.length-2,Math.floor(el/c.step));if(want>c.revealed){c.revealed=want;c.mask=maskOf(BANK.mot[c.list[c.i]].w,c.revOrder.slice(0,want));const m=document.getElementById("maskC");if(m)m.textContent=c.mask;pushState();}}
    if(c.game==="qsj"){const q=BANK.qsj[c.list[c.i]];const want=Math.min(q.c.length,1+Math.floor(el/c.step));if(want>c.clues.length){c.clues=q.c.slice(0,want);renderQ();pushState();}}
    if(c.game==="chrono"){const N=c.payload.items.length;if([0,1,2].every(k=>Object.keys(c.ca[k]).length>=N)||rem<=-0.9)closeQ();return;}
    if(Object.keys(c.answers).length>=3||rem<=-0.9){closeQ();}
  }else if(c.phase==="wager"){
    if(Object.keys(c.wagers).length>=3||rem<=-0.9){clearInterval(LOOP);for(let k=0;k<3;k++)if(!(k in c.wagers))c.wagers[k]=0;c.wagerDone=true;c.phase="ready";c.startAt=null;sndEnd();pushState();renderQ();}
  }else if(c.phase==="buzz"){
    if(rem<=-0.6){clearInterval(LOOP);sndEnd();c.results={};c.phase="reveal";pushState();renderQ();}
  }
}
function updChips(w){const c=G.cur;for(let k=0;k<3;k++){const el=document.getElementById("as"+k);if(!el)continue;const ok=w?(c.wagers&&k in c.wagers):(k in c.answers);el.innerHTML=ok?`<span class="ok">✔ ${w?"Mise reçue":"Réponse reçue"}</span>`:'<span class="small">en attente…</span>';}}
function updChrono(){const c=G.cur;const N=c.payload.items.length;for(let k=0;k<3;k++){const n=Object.keys(c.ca[k]).length;const b=document.getElementById("cb"+k);if(b)b.style.width=(n/N*100)+"%";const t=document.getElementById("ct"+k);if(t)t.textContent=n+" / "+N;}}
function closeQ(){
  const c=G.cur;if(c.phase!=="question")return;
  clearInterval(LOOP);sndEnd();
  const q=c.game==="chrono"?null:BANK[BANKOF(c.game)][c.list[c.i]];
  const R={};const speed=k=>c.answers[k]?Math.max(0,1-c.answers[k].t/(c.dur*1000)):0;
  for(let k=0;k<3;k++){
    const a=c.answers[k];
    if(c.game==="qcm"||c.game==="intrus"){const ok=!!a&&a.v===c.right;R[k]={ok,pts:ok?Math.round(100+50*speed(k)):0,label:a?"ABCD"[a.v]+". "+c.payload.o[a.v]:"Pas de réponse"};}
    if(c.game==="mise"){const ok=!!a&&a.v===c.right;const w=c.wagers[k]||0;R[k]={ok,pts:ok?w:-w,label:(a?"ABCD"[a.v]+". "+c.payload.o[a.v]:"Pas de réponse")+" · mise "+w};}
    if(c.game==="vf"){const ok=!!a&&a.v===q.a;R[k]={ok,pts:ok?Math.round(60+40*speed(k)):0,label:a?(a.v?"VRAI":"FAUX"):"Pas de réponse"};}
    if(c.game==="mot"){const ok=!!a&&[q.w].concat(q.alt||[]).some(x=>norm(x)===norm(a.v));const rev=a?Math.min(c.letters.length-2,Math.floor((a.t/1000)/c.step)):0;R[k]={ok,pts:ok?Math.max(50,200-25*rev):0,label:a?a.v:"Pas de réponse"};}
    if(c.game==="qsj"){const ok=!!a&&[q.w].concat(q.alt||[]).some(x=>norm(x)===norm(a.v));const seen=a?Math.min(q.c.length,1+Math.floor((a.t/1000)/c.step)):4;R[k]={ok,pts:ok?[200,150,100,60][seen-1]:0,label:a?a.v+" ("+seen+" indice"+(seen>1?"s":"")+")":"Pas de réponse"};}
    if(c.game==="tri"){const v=a?a.v:[];let n=0;c.items.forEach((it,j)=>{if(v[j]===q.items[it][1])n++;});R[k]={ok:n===c.items.length,pts:n*25,label:n+" / "+c.items.length+" bien classés",part:n>0&&n<c.items.length};}
    if(c.game==="ordre"){const v=a?a.v:[];let n=0;c.items.forEach((orig,j)=>{if(v[j]===orig)n++;});const all=n===c.items.length;R[k]={ok:all,pts:n*30+(all?50:0),label:n+" / "+c.items.length+" bien placées",part:n>0&&!all};}
    if(c.game==="chrono"){let ok=0,ko=0;Object.entries(c.ca[k]).forEach(([i,v])=>{if(v===c.key[+i])ok++;else ko++;});R[k]={ok:ok>0&&ko===0,part:ok>0&&ko>0,pts:Math.max(0,ok*20-ko*10),label:ok+" bonne"+(ok>1?"s":"")+" · "+ko+" erreur"+(ko>1?"s":"")};}
  }
  if(c.game==="num"){
    const ans=[0,1,2].filter(k=>c.answers[k]&&c.answers[k].v!==""&&!isNaN(+c.answers[k].v)).map(k=>({k,d:Math.abs(+c.answers[k].v-q.a)}));
    const ds=[...new Set(ans.map(x=>x.d))].sort((a,b)=>a-b);const tab=[150,100,50];
    for(let k=0;k<3;k++){const a=c.answers[k];const e=ans.find(x=>x.k===k);
      if(!e){R[k]={ok:false,pts:0,label:"Pas de réponse"};continue;}
      const rank=ds.indexOf(e.d);let pts=tab[rank]||0;if(e.d===0)pts+=50;
      R[k]={ok:e.d===0,part:e.d!==0&&rank===0,pts,label:a.v+" "+q.u+(e.d===0?" (exact !)":" (écart "+fmtN(e.d)+")")};}
  }
  for(let k=0;k<3;k++){G.teams[k].score+=R[k].pts;c.gained[k]+=R[k].pts;}
  if([0,1,2].some(k=>R[k].ok))sndOk();
  if(c.game==="tri")c.correctLabel=q.c.map((cat,ci)=>cat+" : "+q.items.filter(it=>it[1]===ci).map(it=>it[0]).join(", ")).join(" — ");
  if(c.game==="chrono")c.correctLabel=null;
  c.results=R;c.phase="reveal";
  pushState();renderQ();
}
function buzzJudge(ok){
  const c=G.cur;const k=c.buzzed;
  if(ok){G.teams[k].score+=150;c.gained[k]+=150;sndOk();c.results={[k]:{ok:true,pts:150}};c.phase="reveal";pushState();renderQ();return;}
  G.teams[k].score-=50;c.gained[k]-=50;c.excluded.push(k);c.buzzed=null;
  if(c.excluded.length>=3){c.results={};c.phase="reveal";pushState();renderQ();return;}
  c.attempt++;launchQ();
}
function skipBuzz(){clearInterval(LOOP);const c=G.cur;c.results={};c.phase="reveal";pushState();renderQ();}

function renderQ(){
  const c=G.cur,g=gameDef(c.game),q=c.game==="chrono"?null:BANK[BANKOF(c.game)][c.list[c.i]];

      body+=c.phase==="ready"&&c.game==="mise"?`<div class="qtext">Les mises sont faites. Prêts pour la question ?</div>`:`<div class="qtext">${esc(c.payload.t)}</div><div class="opts">${c.payload.o.map((o,j)=>`<div class="opt o${j} ${c.phase==="reveal"?(j===c.right?"right":"dim"):""}"><span class="sh">${"▲◆●■"[j]}</span>${"ABCD"[j]}. ${esc(o)}</div>`).join("")}</div>`;
    }
  }
  if(c.game==="vf"){body=`<div class="qtext">${esc(c.payload.t)}</div><div class="opts"><div class="opt o3 ${c.phase==="reveal"?(q.a?"right":"dim"):""}"><span class="sh">✔</span>VRAI</div><div class="opt o0 ${c.phase==="reveal"?(!q.a?"right":"dim"):""}"><span class="sh">✘</span>FAUX</div></div>`;}
  if(c.game==="num"){body=`<div class="qtext">${esc(c.payload.t)} <span style="color:var(--amber)">${c.payload.u?"(en "+esc(c.payload.u)+")":""}</span></div>`;}
  if(c.game==="mot"){body=`<div class="qtext">${esc(c.payload.d)}</div><div class="mask" id="maskC">${c.phase==="reveal"?esc(q.w):esc(c.mask)}</div>`;}
  if(c.game==="qsj"){const shown=c.phase==="reveal"?q.c:(c.phase==="ready"?[]:c.clues);body=`<div class="qtext">Qui suis-je ?</div>${shown.map((cl,i)=>`<div class="triitem" style="font-size:24px"><span>🔎 Indice ${i+1} : ${esc(cl)}</span></div>`).join("")}${c.phase==="ready"?`<p class="sub">Les indices apparaîtront au lancement du chrono.</p>`:""}`;}
  if(c.game==="tri"){body=`<div class="qtext">${esc(c.payload.t)}</div><div class="grid2">${c.payload.items.map((it,j)=>`<div class="triitem"><span>${esc(it)}</span>${c.phase==="reveal"?`<b style="color:var(--amber)">${esc(q.c[q.items[c.items[j]][1]])}</b>`:""}</div>`).join("")}</div>`;}
  if(c.game==="ordre"){body=`<div class="qtext">${esc(c.payload.t)}</div>${c.phase==="reveal"?q.items.map((it,k)=>`<div class="triitem"><span><b style="color:var(--amber)">${k+1}.</b> ${esc(it)}</span></div>`).join(""):c.payload.items.map(it=>`<div class="triitem"><span>• ${esc(it)}</span></div>`).join("")}`;}
  if(c.game==="chrono"){const N=c.payload.items.length;body=`<div class="qtext">${c.phase==="ready"?"Prêts ? 30 questions vous attendent sur vos PC.":c.phase==="question"?"Course en cours : répondez sur vos PC !":"Fin de la manche !"}</div>${G.teams.map((t,k)=>{const n=Object.keys(c.ca[k]).length;return `<div style="margin:14px 0"><div class="row" style="justify-content:space-between"><b style="color:${TEAMC[k]};font-size:22px">${esc(t.name)}</b><b id="ct${k}" style="font-size:22px">${n} / ${N}</b></div><div style="height:26px;background:#0A2236;border-radius:13px;overflow:hidden;border:2px solid var(--line)"><div id="cb${k}" style="height:100%;width:${n/N*100}%;background:${TEAMC[k]};transition:width .3s"></div></div></div>`;}).join("")}`;}
  if(c.game==="buzz"){body=`<div class="qtext">${esc(c.payload.t)}</div>`;
    if(c.phase==="buzzed")body+=`<div class="card tc${c.buzzed} flash center" style="font-size:40px;font-weight:900">🔴 ${esc(G.teams[c.buzzed].name)} a buzzé !</div>
      <details class="mt"><summary class="small">Afficher la réponse attendue (formateur)</summary><div class="answer-box">${esc(q.r)}</div></details>
      <div class="row mt"><button class="btn grn" onclick="buzzJudge(true)">✔ Bonne réponse (+150)</button><button class="btn red" onclick="buzzJudge(false)">✘ Mauvaise réponse (−50)</button></div>`;
    if(c.excluded.length&&c.phase!=="reveal")body+=`<p class="small">Ne peuvent plus buzzer : ${c.excluded.map(k=>esc(G.teams[k].name)).join(", ")}</p>`;
  }
  let foot="";
  if(c.phase==="ready")foot=`<div class="row mt"><button class="btn amb" onclick="launchQ()">▶ ${c.game==="mise"&&!c.wagerDone?"Ouvrir les mises":"Lancer le chrono"}</button><button class="btn ghost" onclick="endGame()">Terminer ce jeu</button></div>`;
  if(c.phase==="question"&&c.game!=="chrono")foot=`<div class="ansbar">${G.teams.map((t,k)=>`<div class="chip tc${k}"><span>${esc(t.name)}</span><span id="as${k}"><span class="small">en attente…</span></span></div>`).join("")}</div><div class="row mt"><button class="btn ghost sm" onclick="closeQ()">Arrêter le chrono et corriger</button></div>`;
  if(c.phase==="question"&&c.game==="chrono")foot=`<div class="row mt"><button class="btn ghost sm" onclick="closeQ()">Arrêter la manche et corriger</button></div>`;
  if(c.phase==="wager")foot=`<div class="ansbar">${G.teams.map((t,k)=>`<div class="chip tc${k}"><span>${esc(t.name)}</span><span id="as${k}"><span class="small">en attente…</span></span></div>`).join("")}</div>`;
  if(c.phase==="buzz")foot=`<p class="sub">🔴 Buzzez sur vos PC !</p><div class="row mt"><button class="btn ghost sm" onclick="skipBuzz()">Personne ne trouve : réponse</button></div>`;
  if(c.phase==="reveal"){
    if(c.correctLabel&&!["qcm","intrus","mise","vf","tri"].includes(c.game))foot+=`<div class="answer-box">Réponse : ${esc(c.correctLabel)}</div>`;
    if(c.game==="tri")foot+=`<div class="answer-box" style="font-size:17px">${esc(c.correctLabel)}</div>`;
    if(c.game==="buzz"){const k=Object.keys(c.results||{})[0];foot+=k!==undefined?`<p style="font-size:24px" class="ok">${esc(G.teams[k].name)} remporte 150 points !</p>`:`<p class="sub">Aucune équipe ne marque sur cette question.</p>`;}
    else foot+=`<table class="res mt"><tr><th>Équipe</th><th>Réponse</th><th>Points</th></tr>${G.teams.map((t,k)=>{const r=c.results[k];return `<tr><td><b style="color:${TEAMC[k]}">${esc(t.name)}</b></td><td class="${r.ok?"ok":(r.part?"":"ko")}">${r.ok?"✔ ":(r.part?"◐ ":"✘ ")}${esc(r.label)}</td><td><b>${r.pts>=0?"+":""}${r.pts}</b></td></tr>`;}).join("")}</table>`;
    foot+=`<div class="row mt"><button class="btn amb" onclick="nextQ()">${c.i+1<c.list.length?(c.game==="chrono"?"Manche suivante →":"Question suivante →"):"Voir le bilan du jeu →"}</button></div>`;
  }
  app().innerHTML=`<div class="cwrap"><div class="card">${head}${body}${foot}</div>${scoreboardHTML()}</div>`;
  if(c.phase==="question"&&c.game!=="chrono")updChips();
  if(c.phase==="wager")updChips(true);
}
function endGame(){

function adjustScores(){

let TM={code:"",team:null,v:-1,qid:null,key:null,sent:false,tri:[],ord:[],state:null,deadline:null,pend:null,joinHB:null,timerI:null,opened:false,ci:0,cpend:{}};
function teamJoinScreen(){
  let prev={};try{prev=JSON.parse(localStorage.getItem("gci_team")||"{}");}catch(e){}
  app().innerHTML=`<div class="card" style="max-width:640px;margin:40px auto">
   <div class="logo">PC d'équipe</div><h2>Rejoindre la partie</h2>
   <label class="l">Code affiché au tableau</label><input id="jc" inputmode="numeric" maxlength="4" value="${esc(prev.code||"")}" style="font-size:34px;text-align:center;letter-spacing:.3em">
   <div class="row mt"><button class="btn" id="jbtn" onclick="teamCheck()">Valider le code</button><span id="jm"></span></div>
   <div id="jteams" class="mt"></div></div>`;
}
async function teamCheck(){
  const code=$("#jc").value.trim();if(!/^\d{4}$/.test(code)){$("#jm").innerHTML='<span class="ko">Le code comporte 4 chiffres.</span>';return;}
  $("#jbtn").disabled=true;$("#jm").textContent="Recherche de la partie…";
  if(!TM.opened||TM.code!==code){TM.code=code;await Net.open(code,teamOnMsg);TM.opened=true;}
  TM.state=null;Net.send({t:"hello"});
  let n=0;const w=setInterval(()=>{n++;
    if(TM.state){clearInterval(w);$("#jm").innerHTML='<span class="ok">Partie trouvée ✓</span>';
      $("#jteams").innerHTML=`<p class="sub">Choisissez votre équipe :</p>`+TM.state.teams.map((t,i)=>`<button class="btn tc${i}" style="width:100%;margin:6px 0;font-size:22px;box-shadow:none;border:3px solid" onclick="teamEnter(${i})">${esc(t.name)}</button>`).join("");}
    else if(n%4===0)Net.send({t:"hello"});
    if(n>=24&&!TM.state){clearInterval(w);$("#jbtn").disabled=false;$("#jm").innerHTML='<span class="ko">Partie introuvable : vérifiez le code et que le PC central a bien lancé la partie.</span>';}
  },250);
}
function teamEnter(k){
  TM.team=k;try{localStorage.setItem("gci_team",JSON.stringify({code:TM.code,team:k}));}catch(e){}
  TM.key=null;Net.send({t:"join",team:k});
  clearInterval(TM.joinHB);TM.joinHB=setInterval(()=>Net.send({t:"join",team:k}),4000);
  clearInterval(TM.timerI);TM.timerI=setInterval(teamTimer,250);
  if(TM.state)renderTeamIfNeeded(true);
}
function teamOnMsg(m){
  if(!m||m.t!=="st")return;const s=m.s;
  TM.state=s;
  if(TM.team===null)return;
  if(s.remMs!=null){const d=now()+s.remMs;const dk=s.qid+"|"+s.attempt+"|"+s.qphase;if(TM.deadline==null||Math.abs(d-TM.deadline)>600||TM.dlKey!==dk){TM.deadline=d;TM.dlKey=dk;}}
  else TM.deadline=null;
  if(TM.pend&&s.qid===TM.pend.qid){const ack=TM.pend.kind==="wg"?(s.wgot&&s.wgot[TM.team]):(s.got&&s.got[TM.team]);if(ack)TM.pend=null;}
  if(s.rc&&s.qid===TM.qid){(s.rc[TM.team]||[]).forEach(i=>delete TM.cpend[i]);}
  renderTeamIfNeeded(false);
}
function renderTeamIfNeeded(force){
  const s=TM.state;
  const key=s.phase+"|"+(s.qid||"")+"|"+(s.qphase||"")+"|"+(s.attempt||0)+"|"+(s.phase==="intro"?s.introGame:"")+"|"+(s.wagers?"w":"");
  if(s.qid!==TM.qid){TM.qid=s.qid;TM.sent=false;TM.tri=[];TM.ord=[];TM.pend=null;TM.ci=0;TM.cpend={};TM.wsent=false;}
  if(!force&&TM.key===key){
    updHead();
    if(s.game==="mot"&&s.qphase==="question"){const m=document.getElementById("maskT");if(m)m.textContent=s.mask;}
    if(s.game==="qsj"&&s.qphase==="question"){const m=document.getElementById("cluesT");if(m)m.innerHTML=cluesHTML(s.clues);}
    return;
  }
  TM.key=key;renderTeam();
}
function cluesHTML(cl){return (cl||[]).map((c,i)=>`<div class="triitem" style="font-size:21px"><span>🔎 Indice ${i+1} : ${esc(c)}</span></div>`).join("");}
function teamHead(){const s=TM.state,t=s.teams[TM.team];return `<div class="thead tc${TM.team}"><span>${esc(t.name)}</span><span id="tscore">${t.score} pts</span></div>`;}
function updHead(){const el=document.getElementById("tscore");if(el&&TM.state)el.textContent=TM.state.teams[TM.team].score+" pts";}
function remT(){return TM.deadline==null?null:(TM.deadline-now())/1000;}
function teamTimer(){
  const s=TM.state;if(!s)return;
  if(TM.pend&&now()-TM.pend.at>1200){TM.pend.at=now();Net.send(TM.pend.m);}
  const cp=Object.values(TM.cpend);if(cp.length&&(!TM.cpAt||now()-TM.cpAt>1200)){TM.cpAt=now();cp.forEach(m=>Net.send(m));}
  const tw=document.getElementById("ttw");
  if(!tw||!["question","buzz","wager"].includes(s.qphase))return;
  const r=remT();if(r===null)return;tw.innerHTML=timerSVG(r,s.dur);
  if(r<=0&&s.qphase==="question"&&!TM.sent&&s.game!=="chrono"){
    if(s.game==="tri"&&TM.tri.some(x=>x!=null))return sendAns(TM.tri.map(x=>x??-1),true);
    if(s.game==="ordre"&&TM.ord.some(x=>x!=null))return sendAns(TM.ord.map(x=>x??-1),true);
    lockTeam("⏱️ Temps écoulé !");
  }
  if(r<=0&&s.qphase==="question"&&s.game==="chrono"){const z=document.getElementById("tz");if(z&&!z.dataset.end){z.dataset.end=1;z.innerHTML=`<div class="verdict neu">⏱️ Fin de la manche ! Regardez l'écran central.</div>`;}}
  if(r<=0&&s.qphase==="wager"&&!TM.wsent)lockTeam("⏱️ Temps écoulé : mise de 0 point.");
  if(r<=0&&s.qphase==="buzz"){const b=document.getElementById("bzb");if(b&&!b.disabled){b.disabled=true;b.textContent="Temps écoulé";}}
}
function lockTeam(msg){document.querySelectorAll("#tz button,#tz input,#tz select").forEach(e=>e.disabled=true);const m=document.getElementById("tmsg");if(m)m.innerHTML=`<div class="verdict neu">${msg}</div>`;}
function sendAns(v,auto){
  if(TM.sent)return;const r=remT();
  if(!auto&&r!==null&&r<-0.3){lockTeam("⏱️ Temps écoulé !");return;}
  TM.sent=true;lockTeam(auto?"⏱️ Temps écoulé : votre réponse a été envoyée.":"✔ Réponse envoyée. Regardez l'écran central !");
  const m={t:"ans",qid:TM.state.qid,team:TM.team,v};
  TM.pend={qid:m.qid,m,at:now(),kind:"ans"};Net.send(m);
}
function sendWager(){
  if(TM.wsent)return;const s=TM.state;const mx=s.wmax[TM.team];
  let w=parseInt(document.getElementById("wgIn").value,10);if(isNaN(w))w=0;w=Math.max(0,Math.min(mx,w));
  TM.wsent=true;lockTeam("✔ Mise de "+w+" points envoyée !");
  const m={t:"wg",qid:s.qid,team:TM.team,w};TM.pend={qid:m.qid,m,at:now(),kind:"wg"};Net.send(m);
}
function setWager(v){const el=document.getElementById("wgIn");if(el&&!el.disabled)el.value=v;}
function sendBuzz(){
  const s=TM.state;const b=document.getElementById("bzb");b.disabled=true;b.textContent="BUZZÉ !";sndBuzz();
  const m={t:"bz",qid:s.qid,attempt:s.attempt,team:TM.team};Net.send(m);setTimeout(()=>Net.send(m),500);
}
function chronoAnswer(v){
  const s=TM.state;const r=remT();if(r!==null&&r<=0)return;
  const i=TM.ci;const m={t:"ca",qid:s.qid,team:TM.team,i,v};TM.cpend[i]=m;Net.send(m);

}
function renderChronoItem(){
  const s=TM.state;const z=document.getElementById("tz");if(!z)return;const items=s.payload.items;

}
function renderTeam(){
  const s=TM.state;let h=teamHead();
  if(s.phase==="lobby"||s.phase==="menu")h+=`<div class="waiting">👀 Partie rejointe !<br><br>Regardez l'écran central : le prochain jeu va commencer.</div>`;
  else if(s.phase==="intro")h+=`<div class="card center"><div style="font-size:70px">${s.introIc||""}</div><h1 class="big">${esc(s.introGame)}</h1><p style="font-size:21px;line-height:1.5">${esc(s.introRules)}</p></div>`;
  else if(s.phase==="gameend")h+=`<div class="card center"><h1 class="big">Fin du jeu : ${esc(s.gtitle)}</h1><p class="sub" style="font-size:26px">Votre équipe a marqué <b style="color:var(--amber)">${s.gained?s.gained[TM.team]:0} points</b> dans ce jeu.</p></div>`;
  else if(s.phase==="final"){const o=[0,1,2].sort((a,b)=>s.teams[b].score-s.teams[a].score);const rk=o.indexOf(TM.team)+1;h+=`<div class="card center"><h1 class="big">${rk===1?"🏆 Victoire !":"Bravo !"}</h1><p style="font-size:30px">Votre équipe termine <b>${rk===1?"1re":rk+"e"}</b> avec ${s.teams[TM.team].score} points.</p></div>`;if(rk===1)confetti();}
  else if(s.phase==="game"&&s.payload){
    const P=s.payload,qp=s.qphase,lab=s.game==="chrono"?"Manche":"";
    h+=`<div class="card"><div class="qhead"><div class="qnum">${esc(s.gtitle)} · ${lab} ${s.num} / ${s.total}</div><div id="ttw">${qp==="ready"?"":""}</div></div>`;
    if(qp==="ready"){h+=`<div class="waiting">${s.game==="mise"&&s.wagers?"Mises enregistrées : votre mise est de <b style='color:var(--amber)'>"+s.wagers[TM.team]+" points</b>.<br><br>La question arrive…":"Prêts ? Ça va commencer…"}</div></div>`;}
    else if(qp==="wager"){
      const mx=s.wmax[TM.team];
      h+=`<div id="tz"><div class="qtext">💰 Combien misez-vous ? (maximum ${mx} points)</div><div class="row">${[0,.25,.5,1].map(f=>Math.round(mx*f)).map(v=>`<button class="btn ghost" onclick="setWager(${v})">${v}</button>`).join("")}</div><div class="row mt"><input id="wgIn" type="number" min="0" max="${mx}" value="${Math.round(mx/2)}" style="max-width:220px;font-size:32px;text-align:center"><button class="btn amb" onclick="sendWager()">Valider ma mise</button></div></div><div id="tmsg"></div></div>`;
    }
    else if(qp==="question"){
      h+=`<div id="tz">`;
      if(QCMLIKE.includes(s.game))h+=`<div class="qtext">${esc(P.t)}</div><div class="opts">${P.o.map((o,j)=>`<button class="opt o${j}" onclick="this.classList.add('sel');sendAns(${j})"><span class="sh">${"▲◆●■"[j]}</span>${"ABCD"[j]}. ${esc(o)}</button>`).join("")}</div>`;
      if(s.game==="vf")h+=`<div class="qtext">${esc(P.t)}</div><div class="opts"><button class="opt o3" onclick="this.classList.add('sel');sendAns(true)"><span class="sh">✔</span>VRAI</button><button class="opt o0" onclick="this.classList.add('sel');sendAns(false)"><span class="sh">✘</span>FAUX</button></div>`;
      if(s.game==="num")h+=`<div class="qtext">${esc(P.t)}</div><div class="row"><input id="numIn" type="number" step="any" style="max-width:300px;font-size:34px;text-align:center"><b style="font-size:24px">${esc(P.u)}</b><button class="btn amb" onclick="const v=document.getElementById('numIn').value;if(v!=='')sendAns(v)">Valider</button></div>`;
      if(s.game==="mot")h+=`<div class="qtext">${esc(P.d)}</div><div class="mask" id="maskT">${esc(s.mask)}</div><div class="row"><input id="motIn" placeholder="Votre mot (un seul essai)" style="max-width:460px;font-size:26px;text-transform:uppercase"><button class="btn amb" onclick="const v=document.getElementById('motIn').value.trim();if(v)sendAns(v)">Valider</button></div>`;
      if(s.game==="qsj")h+=`<div class="qtext">Qui suis-je ?</div><div id="cluesT">${cluesHTML(s.clues)}</div><div class="row mt"><input id="qsjIn" placeholder="Votre réponse (un seul essai)" style="max-width:460px;font-size:24px;text-transform:uppercase"><button class="btn amb" onclick="const v=document.getElementById('qsjIn').value.trim();if(v)sendAns(v)">Valider</button></div>`;
      if(s.game==="tri"){if(!TM.tri.length)TM.tri=P.items.map(()=>null);h+=`<div class="qtext" style="font-size:26px">${esc(P.t)}</div>${P.items.map((it,j)=>`<div class="triitem"><span>${esc(it)}</span><span class="bt">${P.c.map((c,ci)=>`<button id="tb${j}_${ci}" class="${TM.tri[j]===ci?"on":""}" onclick="triSet(${j},${ci})">${esc(c)}</button>`).join("")}</span></div>`).join("")}<button class="btn amb mt" onclick="sendAns(TM.tri.map(x=>x??-1))">Valider mon classement</button>`;}
      if(s.game==="ordre"){const n=P.items.length;if(!TM.ord.length)TM.ord=P.items.map(()=>null);h+=`<div class="qtext" style="font-size:26px">${esc(P.t)}</div>${P.items.map((it,j)=>`<div class="triitem"><span>${esc(it)}</span><select style="width:110px" onchange="ordSet(${j},this.value)"><option value="">Rang…</option>${Array.from({length:n},(_,r)=>`<option value="${r}" ${TM.ord[j]===r?"selected":""}>${r+1}</option>`).join("")}</select></div>`).join("")}<button class="btn amb mt" onclick="sendAns(TM.ord.map(x=>x??-1))">Valider mon ordre</button>`;}
      h+=`</div><div id="tmsg"></div></div>`;
    }
    else if(qp==="buzz"||qp==="buzzed"){
      const ex=(s.excluded||[]).includes(TM.team);
      h+=`<div class="qtext">${esc(P.t)}</div><div class="center">`;
      if(qp==="buzzed")h+=`<div class="verdict ${s.buzzed===TM.team?"ok":"neu"}">${s.buzzed===TM.team?"🎤 À vous ! Répondez à l'oral":"🔴 "+esc(s.teams[s.buzzed].name)+" a buzzé"}</div>`;
      else h+=`<button class="buzz" id="bzb" ${ex?"disabled":""} onclick="sendBuzz()">${ex?"Exclus sur cette question":"BUZZ"}</button>`;
      h+=`</div></div>`;
    }
    else if(qp==="reveal"){
      const r=s.results&&s.results[TM.team];
      const qtxt=s.game==="qsj"?"Qui suis-je ?":s.game==="chrono"?"Fin de la manche":(P.t||P.d||"");
      if(s.game==="buzz")h+=`<div class="qtext">${esc(P.t)}</div><div class="verdict ${r?"ok":"neu"}">${r?"✔ +150 points !":"Réponse : "+esc(s.correct)}</div>`;
      else h+=`<div class="qtext">${esc(qtxt)}</div><div class="verdict ${r&&r.ok?"ok":(r&&r.part?"neu":"ko")}">${r&&r.ok?"✔ Bravo !":(r&&r.part?"◐ "+esc(r.label):"✘ Raté")} <span style="font-size:30px">${r&&r.pts<0?"":"+"}${r?r.pts:0} pts</span></div>${s.correct&&s.game!=="tri"?`<div class="answer-box">Bonne réponse : ${esc(s.correct)}</div>`:""}`;
      h+=`</div>`;
    }
  } else h+=`<div class="waiting">Regardez l'écran central…</div>`;
  app().innerHTML=h;
  if(s.phase==="game"&&s.qphase==="question"&&s.game==="chrono")renderChronoItem();
  if(s.phase==="game"&&s.qphase==="question"&&TM.sent)lockTeam("✔ Réponse envoyée. Regardez l'écran central !");
  if(s.phase==="game"&&s.qphase==="wager"&&TM.wsent)lockTeam("✔ Mise envoyée !");
  teamTimer();
}
function triSet(j,ci){if(TM.sent)return;TM.tri[j]=ci;TM.state.payload.c.forEach((c,k)=>{const b=document.getElementById(`tb${j}_${k}`);if(b)b.classList.toggle("on",k===ci);});}
function ordSet(j,v){if(TM.sent)return;TM.ord[j]=v===""?null:+v;}

/* ====================================================================== */
home();

</script>
</body>
</html>
